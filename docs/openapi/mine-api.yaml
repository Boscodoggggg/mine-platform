      required: [note, version]
      properties:
        note: { type: string, minLength: 1, maxLength: 1000 }
        version: { type: integer, format: int64, minimum: 0 }
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    DeviceStatus:
      type: string
      enum: [ENABLED, DISABLED, ARCHIVED]
    Product:
      type: object
      required: [id, productKey, name, deviceType, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        productKey: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        name: { type: string, maxLength: 128 }
        deviceType: { type: string, maxLength: 64 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    ProductCreateRequest:
      type: object
      required: [productKey, name, deviceType, status]
      properties:
        productKey: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        deviceType: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [DRAFT, ACTIVE] }
    ProductUpdateRequest:
      type: object
      required: [name, deviceType, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        deviceType: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [DRAFT, ACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
    Device:
      type: object
      required: [id, productId, deviceCode, name, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$' }
        name: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    DevicePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Device' }
    DeviceCreateRequest:
      type: object
      required: [productId, deviceCode, name, status]
      properties:
        productId: { type: string, format: uuid }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ENABLED, DISABLED] }
    DeviceAccessOverallStatus:
      type: string
      enum: [NOT_CONFIGURED, WAITING_FOR_DEVICE, TRANSPORT_ONLY, ONLINE, STALE, FAILED, UNKNOWN]
    DeviceAccessStageStatus:
      type: string
      enum: [PASSED, FAILED, WAITING, UNKNOWN, SKIPPED]
    DeviceAccessStatus:
      type: object
      required: [deviceId, status, message]
      properties:
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeviceAccessOverallStatus' }
        firstSeenAt: { type: [string, 'null'], format: date-time }
        lastReceivedAt: { type: [string, 'null'], format: date-time }
        offlineThresholdSeconds: { type: [integer, 'null'], minimum: 1 }
        message: { type: string, description: 稳定原因码，由客户端国际化展示 }
    DeviceAccessTestStage:
      type: object
      required: [layer, status, message, durationMillis]
      properties:
        layer: { type: string, enum: [ENDPOINT, TRANSPORT, ACTIVITY, DATA] }
        status: { $ref: '#/components/schemas/DeviceAccessStageStatus' }
        message: { type: string, description: 稳定原因码，由客户端国际化展示 }
        observedAt: { type: [string, 'null'], format: date-time }
        durationMillis: { type: integer, format: int64, minimum: 0 }
    DeviceAccessTestResult:
      type: object
      required: [deviceId, status, checkedAt, durationMillis, message, stages]
      properties:
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeviceAccessOverallStatus' }
        checkedAt: { type: string, format: date-time }
        durationMillis: { type: integer, format: int64, minimum: 0 }
        message: { type: string, description: 稳定结论码，由客户端国际化展示 }
        stages:
          type: array
          items: { $ref: '#/components/schemas/DeviceAccessTestStage' }
    DeviceConnectionMode:
      type: string
      enum: [DEVICE_TO_PLATFORM_MQTT, DEVICE_TO_PLATFORM_TCP, PLATFORM_TO_DEVICE_TCP]
    DeviceConnectionTestStatus:
      type: string
      enum: [NOT_TESTED, PASSED, PARTIAL, FAILED]
    DeviceConnectionTestStage:
      type: object
      required: [stage, status, message, durationMillis]
      properties:
        stage: { type: string, enum: [CONFIG, DNS, TCP, TLS, DEVICE_CONFIRMATION] }
        status: { type: string, enum: [PASSED, FAILED, SKIPPED] }
        message:
          type: string
          maxLength: 500
          description: 稳定诊断原因码，由客户端国际化展示
        durationMillis: { type: integer, format: int64, minimum: 0 }
    DeviceConnectionProfile:
      type: object
      required:
        - id
        - deviceId
        - connectionMode
        - host
        - port
        - tlsEnabled
        - connectTimeoutMillis
        - keepAliveSeconds
        - offlineThresholdSeconds
        - lastTestStatus
        - lastTestStages
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        connectionMode: { $ref: '#/components/schemas/DeviceConnectionMode' }
        host: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tlsEnabled: { type: boolean }
        tlsServerName: { type: [string, 'null'], maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$' }
        connectTimeoutMillis: { type: integer, minimum: 250, maximum: 30000 }
        keepAliveSeconds: { type: integer, minimum: 0, maximum: 86400 }
        offlineThresholdSeconds: { type: integer, minimum: 1, maximum: 604800 }
        lastTestStatus: { $ref: '#/components/schemas/DeviceConnectionTestStatus' }
        lastTestAt: { type: [string, 'null'], format: date-time }
        lastTestDurationMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        lastTestMessage: { type: [string, 'null'], maxLength: 500 }
        lastTestStages:
          type: array
          items: { $ref: '#/components/schemas/DeviceConnectionTestStage' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    DeviceConnectionProfileRequest:
      type: object
      required:
        - connectionMode
        - host
        - port
        - tlsEnabled
        - connectTimeoutMillis
        - keepAliveSeconds
        - offlineThresholdSeconds
        - version
      properties:
        connectionMode: { $ref: '#/components/schemas/DeviceConnectionMode' }
        host: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tlsEnabled: { type: boolean }
        tlsServerName: { type: [string, 'null'], maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$' }
        connectTimeoutMillis: { type: integer, minimum: 250, maximum: 30000 }
        keepAliveSeconds: { type: integer, minimum: 0, maximum: 86400 }
        offlineThresholdSeconds: { type: integer, minimum: 1, maximum: 604800 }
        version: { type: integer, format: int64, minimum: 0 }
    DeviceConnectionTestResult:
      type: object
      required: [deviceId, status, startedAt, durationMillis, message, stages]
      properties:
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeviceConnectionTestStatus' }
        startedAt: { type: string, format: date-time }
        durationMillis: { type: integer, format: int64, minimum: 0 }
        message:
          type: string
          maxLength: 500
          description: 稳定诊断结论码，由客户端国际化展示
        stages:
          type: array
          items: { $ref: '#/components/schemas/DeviceConnectionTestStage' }
    DeviceUpdateRequest:
      type: object
      required: [name, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ENABLED, DISABLED] }
        version: { type: integer, format: int64, minimum: 0 }
    ArchiveRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    PageMetadata:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PropertyId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
    TelemetryQuality:
      type: string
      enum: [GOOD, UNCERTAIN, BAD, TIME_UNTRUSTED]
    DeviceLatest:
      type: object
      required: [deviceId, items, missingPropertyIds]
      properties:
        deviceId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLatestItem'
        missingPropertyIds:
          type: array
          items:
            $ref: '#/components/schemas/PropertyId'
    TelemetryLatestItem:
      type: object
      required: [propertyId, value, occurredAt, receivedAt, quality, eventId, source]
      properties:
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        value:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: string
          format: uuid
        bootId:
          type: [string, 'null']
        sequence:
          type: [integer, 'null']
          format: int64
        source:
          type: string
          enum: [REDIS, TIMESCALEDB]
    TelemetryHistory:
      type: object
      required: [deviceId, propertyId, aggregation, watermark, items, page, size, total]
      properties:
        deviceId:
          type: string
          format: uuid
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        aggregation:
          type: string
          enum: [RAW, AVG, MIN, MAX]
        bucket:
          type: [string, 'null']
          format: duration
        watermark:
          type: integer
          format: int64
          minimum: 0
          description: 本次分页数据集固定使用的数据库摄取水位上限。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryHistoryPoint'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 1000
        total:
          type: integer
          format: int64
          minimum: 0
    TelemetryHistoryPoint:
      type: object
      required: [occurredAt, receivedAt, value, quality, sampleCount]
      properties:
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        value:
          type: number
          format: double
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: [string, 'null']
          format: uuid
        sampleCount:
          type: integer
          format: int64
          minimum: 1
    ApiError:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: 参数、属性标识、时间范围或聚合参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 登录状态无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 缺少当前操作要求的权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OperationItemNotFound:
      description: 运行检查项不存在，错误码 SYSTEM-404-006。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: 设备不存在，错误码 DEVICE-404-002。
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    CommandNotFound:
      description: 命令不存在，错误码 COMMAND-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AlarmNotFound:
      description: 告警不存在，错误码 ALARM-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProductNotFound:
      description: 产品不存在，错误码 DEVICE-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConfigurationNotFound:
      description: 协议配置或发布不存在，错误码 PROTOCOL-CONFIG-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StrategyNotFound:
      description: 设备组、策略版本、策略发布或目标设备不存在，错误码前缀为 STRATEGY-404。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 编码重复、状态冲突、策略同级异值、幂等语义或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 命令、目标设备、策略类型、字段值或作用范围不符合业务约束。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TelemetryBusy:
      description: 等待同一属性的共享回源超过 2 秒或时序库查询超时，错误码 TELEMETRY-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RetentionRuntimeUnavailable:
      description: 遥测只读连接未启用或 TimescaleDB 查询失败，错误码 RETENTION-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
