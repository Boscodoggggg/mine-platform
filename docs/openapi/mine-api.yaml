      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: 命令目标设备分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /commands:
    get:
      tags: [CommandCenter]
      operationId: listCommands
      summary: 分页查询命令
      parameters:
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CommandStatus' }
        - name: templateKey
          in: query
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 命令分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CommandCenter]
      operationId: createCommand
      summary: 幂等创建并下发命令
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '201':
          description: 命令已创建并进入可靠出站队列。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /commands/{commandId}:
    get:
      tags: [CommandCenter]
      operationId: getCommand
      summary: 查询命令详情与状态时间线
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: 命令详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
