      operationId: getMineLocationTrajectory
      summary: 查询最多二十四小时的稳定分页轨迹
      description: |
        from 包含、to 不包含，时间窗口不得超过 24 小时。首页服务端固定 watermark，
        后续页必须原样回传 watermark 和 nextCursor，每页最多输出 5000 点。
