global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    mine_site: standalone

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: mine-server
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mine-server:18080"]

  - job_name: mine-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mine-gateway:18081"]

  - job_name: mine-telemetry
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mine-telemetry:18082"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: timescale
    static_configs:
      - targets: ["timescale-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
