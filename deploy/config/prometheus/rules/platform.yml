groups:
  - name: mine-platform-availability
    rules:
      - alert: MineRuntimeServiceDown
        expr: up{job=~"mine-server|mine-gateway|mine-telemetry"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "智慧矿山运行服务不可用"
          description: "{{ $labels.job }} 已连续 2 分钟无法被 Prometheus 抓取。"

      - alert: MineRabbitMqDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ 不可用"
          description: "设备 MQTT 与内部消息总线监控目标不可用。"

      - alert: MineDatabaseExporterDown
        expr: up{job=~"postgres|timescale"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "数据库指标采集失败"
          description: "{{ $labels.job }} exporter 已连续 3 分钟不可用。"

      - alert: MineRedisDown
        expr: up{job="redis"} == 0 or redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可用"
          description: "Redis exporter 无法被采集或无法连接平台 Redis。"

  - name: mine-platform-capacity
    rules:
      - alert: MineJvmHeapPressureHigh
        expr: sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存持续偏高"
          description: "{{ $labels.job }} 堆内存使用率已连续 10 分钟超过 85%。"

      - alert: MineRabbitQueueBacklogHigh
        expr: sum(rabbitmq_queue_messages_ready) > 100000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ 消息积压"
          description: "待消费消息已连续 5 分钟超过 100000 条。"

  - name: mine-gateway-configuration
    rules:
      - alert: MineGatewayConfigurationLoadFailed
        expr: increase(mine_gateway_configuration_distribution_total{outcome="permanent_failure"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway 配置发布永久加载失败"
          description: "最近 10 分钟有配置快照被判定为永久无效，节点已上报 FAILED；请在策略工作台核对发布证据。"

      - alert: MineGatewayConfigurationRetrying
        expr: increase(mine_gateway_configuration_distribution_total{outcome="transient_failure"}[10m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 配置分发持续重试"
          description: "Gateway 在 10 分钟内至少 3 次因网络、磁盘或状态回报失败而重投配置事件。"

  - name: mine-telemetry-strategy-quality
    rules:
      - alert: MineTelemetryStrategyLoadFailed
        expr: increase(mine_telemetry_strategy_distribution_total{outcome="permanent_failure"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Telemetry 数据质量策略永久加载失败"
          description: "最近 10 分钟有策略快照未通过完整性校验并进入死信；最后正确版本仍在运行，请检查策略队列死信和控制面快照。"

      - alert: MineTelemetryStrategyRetrying
        expr: increase(mine_telemetry_strategy_distribution_total{outcome="transient_failure"}[10m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Telemetry 策略分发持续重试"
          description: "Telemetry 在 10 分钟内至少 3 次因控制面、网络或数据库暂时失败而重投策略事件。"

      - alert: MineTelemetryDataQualitySpike
        expr: sum by (rule, result) (increase(mine_telemetry_quality_rule_hits_total[10m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "遥测数据质量异常突增"
          description: "规则 {{ $labels.rule }} 的 {{ $labels.result }} 结果在最近 10 分钟命中至少 100 次；请核对设备时钟、传感器和当前数据质量策略。"

  - name: mine-alarm-runtime
    rules:
      - alert: MineTelemetryAlarmOutboxBacklog
        expr: sum(mine_telemetry_alarm_outbox_events{status=~"PENDING|PUBLISHING"}) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "告警可靠发布持续积压"
          description: "Telemetry 待发布或发布中的告警 Outbox 事件已连续 5 分钟超过 1000 条，请检查 RabbitMQ 和发布确认。"

      - alert: MineTelemetryAlarmOutboxFailed
        expr: mine_telemetry_alarm_outbox_events{status="FAILED"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "告警可靠发布持续重试"
          description: "Telemetry 存在持续 5 分钟尚未重试成功的告警 Outbox 事件，请检查 RabbitMQ 路由、网络和发布确认。"

      - alert: MineTelemetryAlarmOutboxDead
        expr: mine_telemetry_alarm_outbox_events{status="DEAD"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "告警可靠发布事件进入死信"
          description: "Telemetry 存在已耗尽重试次数的告警 Outbox 事件，告警事实尚未送达告警中心，必须立即人工处置。"

      - alert: MineServerAlarmConsumeFailures
        expr: sum(increase(mine_server_alarm_consume_total{outcome="rejected"}[10m])) > 0 or sum(increase(mine_server_alarm_consume_total{outcome="requeued"}[10m])) >= 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "告警事实消费异常"
          description: "最近 10 分钟出现永久拒绝的告警事件，或至少 5 次暂时失败重投；请检查死信、数据库和消息契约。"

      - alert: MineCriticalActiveAlarmsGrowing
        expr: mine_server_alarm_active{severity="CRITICAL"} >= 10 and delta(mine_server_alarm_active{severity="CRITICAL"}[10m]) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "严重活动告警持续增长"
          description: "严重活动告警不少于 10 条且 10 分钟内净增长至少 5 条，请立即进入告警中心组织处置。"
