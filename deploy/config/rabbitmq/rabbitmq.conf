# 平台只部署一个 RabbitMQ 集群，通过 vhost 隔离设备 MQTT 与内部业务消息。
listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# MQTT 设备只能进入设备侧 vhost；匿名连接始终关闭。
mqtt.listeners.tcp.default = 1883
mqtt.allow_anonymous = false
mqtt.vhost = /mine-device
mqtt.exchange = amq.topic
# 弱网持久会话默认使用 classic，避免高连接抖动下频繁创建三副本队列。
# 对少量高价值设备启用 quorum 前必须先用真实连接规模完成容量验证。
mqtt.durable_queue_type = classic
mqtt.prefetch = 50

# 使用现代 definitions 导入方式初始化无密码拓扑。
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# 现场弱网允许心跳短暂抖动，但长期失联仍可及时释放连接。
heartbeat = 60
consumer_timeout = 3600000
channel_max = 2048

log.console = true
log.console.level = info
