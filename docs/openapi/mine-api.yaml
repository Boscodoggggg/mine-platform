      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SceneResourceNotFound:
      description: 三维资源、资源文件、稳定场景或场景版本不存在，例如 MINE-SCENE-ASSET-404-002。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SceneStorageUnavailable:
      description: 三维资源存储不可用，错误码 MINE-SCENE-ASSET-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
