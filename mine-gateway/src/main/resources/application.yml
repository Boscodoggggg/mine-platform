spring:
  application:
    name: mine-gateway
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MINE_GATEWAY_HTTP_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 矿山设备接入服务
    version: ${MINE_APP_VERSION:0.1.0-SNAPSHOT}
