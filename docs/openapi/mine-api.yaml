  /mine/sites/{siteId}/spatial-events:
    get:
      tags: [MineSpatial]
      operationId: listMineSpatialEvents
      summary: 固定水位分页查询空间运行事件
      description: |
        需要 mine:spatial:event:view 权限。默认查询过去 24 小时，最大时间窗 31 天；
        后续页必须原样携带首页返回的 watermark 和 nextCursor，迟到创建的事件不会污染当前分页快照。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: watermark
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: zoneType
          in: query
          schema: { $ref: '#/components/schemas/SpatialZoneType' }
        - name: zoneId
          in: query
          schema: { type: string, format: uuid }
        - name: subjectType
          in: query
          schema: { $ref: '#/components/schemas/LocationSubjectType' }
        - name: subjectId
          in: query
          schema: { type: string, format: uuid }
        - name: eventType
          in: query
          schema: { $ref: '#/components/schemas/SpatialEventType' }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: 空间事件固定水位分页。
          content: { application/json: { schema: { $ref: '#/components/schemas/SpatialEventPageResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SpatialRuntimeUnavailable' }
  /mine/sites/{siteId}/spatial-events/{eventId}:
    get:
      tags: [MineSpatial]
      operationId: getMineSpatialEvent
      summary: 查询空间事件判定证据详情
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 包含触发位置事实和有界判定证据的空间事件。
          content: { application/json: { schema: { $ref: '#/components/schemas/SpatialEventDetailResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MineResourceNotFound' }
        '503': { $ref: '#/components/responses/SpatialRuntimeUnavailable' }
  /mine/sites/{siteId}/spatial-events/replays:
    post:
      tags: [MineSpatial]
      operationId: createMineSpatialReplay
      summary: 幂等登记异步空间历史重放
      description: |
        需要 mine:spatial:replay 权限。HTTP 请求线程只登记 PENDING 任务，不扫描历史位置事实；
        登记时必须能从 Telemetry 当前已激活快照冻结指定区域版本及摘要；
        执行时最多预热窗口前 24 小时状态，避免短窗口请求无界扫描多年历史。
        相同区域版本存在重叠的未完成任务时返回 409。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpatialReplayRequest' } } }
      responses:
        '202':
          description: 重放任务已登记，或返回相同幂等键此前登记的同一任务。
          content: { application/json: { schema: { $ref: '#/components/schemas/SpatialReplayResponse' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MineResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/SpatialRuntimeUnavailable' }
