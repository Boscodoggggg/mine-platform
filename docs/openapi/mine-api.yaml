openapi: 3.1.0
info:
  title: 智慧矿山平台 API
  version: 0.1.0
  description: |
    智慧矿山平台对管理端开放的 REST 契约。本文件当前固化阶段 1 已实现的设备遥测查询接口，
    其他模块随实现逐步纳入。所有时间均为带时区的 ISO-8601 UTC 时间。
servers:
  - url: /api/v1
security:
  - MineToken: []
tags:
  - name: DeviceTelemetry
    description: 设备最新值与数值遥测历史
paths:
  /devices/{deviceId}/latest:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceLatestTelemetry
      summary: 查询设备指定属性的最新值
      description: |
        需要 `device:telemetry:view` 权限。优先读取 Redis；缓存缺失时按设备和属性键合并并发请求，
        从 TimescaleDB 回源最近历史并使用 HSETNX 回填，避免旧历史覆盖并发到达的新数据。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyIds
          in: query
          required: true
          description: 传入数量为 1 至 100；服务去重后按首次出现顺序返回。
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/PropertyId'
      responses:
        '200':
          description: 最新值快照；没有历史的属性出现在 missingPropertyIds。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLatest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /devices/{deviceId}/telemetry:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceTelemetryHistory
      summary: 分页查询设备单个数值属性历史
      description: |
        需要 `device:telemetry:view` 权限。时间范围采用 `[from, to)`；RAW 最多查询 7 天且不能传 bucket；
        AVG、MIN、MAX 最多查询 366 天，bucket 必须在 1 分钟至 24 小时之间且最多产生 10000 个桶。
        bucket 只接受整秒精度。聚合结果的 quality 取桶内最差质量，sampleCount 表示桶内样本数；
        分页 offset 不得超过 1000000。首页可省略 watermark，响应会返回数据库已提交事件的摄取水位；
        后续页必须原样传回，以排除 RabbitMQ 积压、数据库重试和弱网迟到点在翻页期间造成的重复或遗漏。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PropertyId'
        - name: from
          in: query
          required: true
          description: 开始时间，包含。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间，不包含。
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [RAW, AVG, MIN, MAX]
            default: RAW
        - name: bucket
          in: query
          description: 聚合时间桶，使用 ISO-8601 Duration，例如 PT5M；RAW 查询不能传入。
          schema:
            type: string
            format: duration
        - name: watermark
          in: query
          description: 分页数据集的全局摄取水位上限；首页省略，后续页传回首页响应中的 watermark，不得大于服务端当前已提交水位。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 原始遥测点或聚合时间桶分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
components:
  securitySchemes:
    MineToken:
      type: apiKey
      in: header
      name: X-Mine-Token
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 设备 UUID。
      schema:
        type: string
        format: uuid
  schemas:
    PropertyId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
    TelemetryQuality:
      type: string
      enum: [GOOD, UNCERTAIN, BAD, TIME_UNTRUSTED]
    DeviceLatest:
      type: object
      required: [deviceId, items, missingPropertyIds]
      properties:
        deviceId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLatestItem'
        missingPropertyIds:
          type: array
          items:
            $ref: '#/components/schemas/PropertyId'
    TelemetryLatestItem:
      type: object
      required: [propertyId, value, occurredAt, receivedAt, quality, eventId, source]
      properties:
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        value:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: string
          format: uuid
        bootId:
          type: [string, 'null']
        sequence:
          type: [integer, 'null']
          format: int64
        source:
          type: string
          enum: [REDIS, TIMESCALEDB]
    TelemetryHistory:
      type: object
      required: [deviceId, propertyId, aggregation, watermark, items, page, size, total]
      properties:
        deviceId:
          type: string
          format: uuid
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        aggregation:
          type: string
          enum: [RAW, AVG, MIN, MAX]
        bucket:
          type: [string, 'null']
          format: duration
        watermark:
          type: integer
          format: int64
          minimum: 0
          description: 本次分页数据集固定使用的数据库摄取水位上限。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryHistoryPoint'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 1000
        total:
          type: integer
          format: int64
          minimum: 0
    TelemetryHistoryPoint:
      type: object
      required: [occurredAt, receivedAt, value, quality, sampleCount]
      properties:
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        value:
          type: number
          format: double
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: [string, 'null']
          format: uuid
        sampleCount:
          type: integer
          format: int64
          minimum: 1
    ApiError:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: 参数、属性标识、时间范围或聚合参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 登录状态无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 缺少 device:telemetry:view 权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: 设备不存在，错误码 DEVICE-404-002。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TelemetryBusy:
      description: 等待同一属性的共享回源超过 2 秒或时序库查询超时，错误码 TELEMETRY-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
