              schema:
                type: array
                items: { $ref: '#/components/schemas/ProtocolSample' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
    put:
      tags: [ProtocolConfiguration]
      operationId: replaceProtocolSamples
      summary: 原子替换协议草稿的全部黄金样本
      parameters:
        - $ref: '#/components/parameters/ProtocolVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolSamplesRequest' }
      responses:
        '200':
          description: 保存后的黄金样本。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProtocolSample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /protocol-mapping-versions/{protocolVersionId}/test:
    post:
      tags: [ProtocolConfiguration]
