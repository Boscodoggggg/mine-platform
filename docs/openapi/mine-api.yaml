      summary: 查询设备指定属性的最新值
      description: |
        需要 `device:telemetry:view` 权限。优先读取 Redis；缓存缺失时按设备和属性键合并并发请求，
        从 TimescaleDB 回源最近历史并使用 HSETNX 回填，避免旧历史覆盖并发到达的新数据。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyIds
          in: query
          required: true
          description: 传入数量为 1 至 100；服务去重后按首次出现顺序返回。
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/PropertyId'
      responses:
        '200':
          description: 最新值快照；没有历史的属性出现在 missingPropertyIds。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLatest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /devices/{deviceId}/telemetry:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceTelemetryHistory
      summary: 分页查询设备单个数值属性历史
      description: |
        需要 `device:telemetry:view` 权限。时间范围采用 `[from, to)`；RAW 最多查询 7 天且不能传 bucket；
        AVG、MIN、MAX 最多查询 366 天，bucket 必须在 1 分钟至 24 小时之间且最多产生 10000 个桶。
        bucket 只接受整秒精度。聚合结果的 quality 取桶内最差质量，sampleCount 表示桶内样本数；
        分页 offset 不得超过 1000000。首页必须同时省略 watermark 和 rollupWatermark，响应会返回数据库已提交
        事件的摄取水位与已完成聚合事实的版本水位；后续页必须同时原样传回双水位，以排除 RabbitMQ 积压、
        数据库重试、弱网迟到点和新聚合版本在翻页期间造成的重复、遗漏或来源漂移。完整且已超过修正窗口的
        冷区桶优先读取版本化 ROLLUP，热区、边界桶和聚合覆盖缺口按相同摄取水位回退 RAW。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PropertyId'
        - name: from
          in: query
          required: true
          description: 开始时间，包含。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间，不包含。
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [RAW, AVG, MIN, MAX]
            default: RAW
        - name: bucket
          in: query
          description: 聚合时间桶，使用 ISO-8601 Duration，例如 PT5M；RAW 查询不能传入。
          schema:
            type: string
            format: duration
        - name: watermark
          in: query
          description: 分页数据集的全局摄取水位上限；首页省略，后续页传回首页响应中的 watermark，不得大于服务端当前已提交水位。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: rollupWatermark
          in: query
          description: 分页数据集的聚合版本水位上限；必须与 watermark 同时省略或同时传入。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 原始遥测点或聚合时间桶分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
