      tags: [MineScene]
      operationId: publishMineSceneVersion
      summary: 幂等发布并永久锁定场景版本
      description: 需要 mine:scene:publish 权限；失败事务不影响最后正确的已发布版本。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { $ref: '#/components/parameters/SceneId' }
        - { $ref: '#/components/parameters/SceneVersionId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MineArchiveRequest' } } }
      responses:
        '200': { description: 不可变已发布场景版本。, content: { application/json: { schema: { $ref: '#/components/schemas/SceneVersionResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SceneResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /mine/sites/{siteId}/scene-runtime:
    get:
      tags: [MineScene]
      operationId: getMineSceneRuntime
      summary: 查询默认场景最后正确运行快照
      description: |
        需要 mine:scene:view 权限。接口只返回已发布且通过内容摘要、图层数量和资源入口完整性校验的快照；
        不存在可用快照时返回固定降级原因，不泄露草稿、存储路径或外部资源地址。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
      responses:
        '200': { description: 完整运行快照或结构化降级结果。, content: { application/json: { schema: { $ref: '#/components/schemas/SceneRuntimeResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SceneResourceNotFound' }
  /notifications/providers:
    get:
      tags: [NotificationConfiguration]
      operationId: listNotificationProviders
      summary: 查询平台随版本发布的内置通知 Provider
      description: |
        需要 notification:channel:view 权限。只返回稳定 Provider 编码、渠道类型和字段元数据，
        不开放 JAR 上传、外部 Provider 注册或任意代码执行。
      responses:
        '200':
          description: 按 Provider 编码稳定排序的内置目录。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationProviderDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/channels:
    get:
      tags: [NotificationConfiguration]
      operationId: listNotificationChannels
      summary: 查询全部数据库通知渠道
      description: 需要 notification:channel:view 权限；响应永不返回凭据明文或密文。
      responses:
        '200':
          description: 通知渠道安全摘要。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NotificationChannelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [NotificationConfiguration]
      operationId: createNotificationChannel
      summary: 创建数据库通知渠道
      description: |
        需要 notification:channel:edit 权限。secrets 仅在请求中出现，服务端使用通知独立
        AES-256-GCM 数据密钥加密；启用渠道必须满足 Provider 全部必填字段。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelRequest' }
      responses:
        '201':
          description: 已创建的通知渠道安全摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /notifications/channels/{channelId}:
    parameters:
      - name: channelId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [NotificationConfiguration]
      operationId: getNotificationChannel
      summary: 查询指定数据库通知渠道
      responses:
        '200':
          description: 通知渠道安全摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotificationChannelNotFound' }
    put:
      tags: [NotificationConfiguration]
      operationId: updateNotificationChannel
      summary: 使用乐观锁修改数据库通知渠道
      description: |
        需要 notification:channel:edit 权限。未出现的 secret 字段保留，空字符串删除对应字段；
        每次成功更新都使用新版本 AAD 重新加密完整凭据并清空旧验证时间。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelRequest' }
      responses:
        '200':
          description: 修改后的通知渠道安全摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotificationChannelNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    MineToken:
      type: apiKey
      in: header
      name: X-Mine-Token
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 设备 UUID。
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      description: 命令 UUID。
      schema:
        type: string
        format: uuid
    AlarmId:
      name: alarmId
      in: path
      required: true
      description: 告警周期 UUID。
      schema:
        type: string
        format: uuid
    ProtocolVersionId:
      name: protocolVersionId
      in: path
      required: true
      description: 协议映射版本 UUID。
      schema: { type: string, format: uuid }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: 配置发布 UUID。
      schema: { type: string, format: uuid }
    DeviceGroupId:
      name: groupId
      in: path
      required: true
      description: 设备组 UUID。
      schema: { type: string, format: uuid }
    StrategyVersionId:
      name: strategyVersionId
      in: path
      required: true
      description: 策略版本 UUID。
      schema: { type: string, format: uuid }
    StrategyReleaseId:
      name: strategyReleaseId
      in: path
      required: true
      description: 不可变策略发布 UUID。
      schema: { type: string, format: uuid }
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: 组织 UUID。
      schema: { type: string, format: uuid }
    SiteId:
      name: siteId
      in: path
      required: true
      description: 矿区 UUID。
      schema: { type: string, format: uuid }
    VehicleId:
      name: vehicleId
      in: path
      required: true
      description: 车辆 UUID。
      schema: { type: string, format: uuid }
    TagId:
      name: tagId
      in: path
      required: true
      description: 定位标签 UUID。
      schema: { type: string, format: uuid }
    CoordinateSystemId:
      name: systemId
      in: path
      required: true
      description: 坐标系 UUID。
      schema: { type: string, format: uuid }
    CoordinateTransformId:
      name: transformId
      in: path
      required: true
      description: 坐标转换版本 UUID。
      schema: { type: string, format: uuid }
    WaypointId:
      name: waypointId
      in: path
      required: true
      description: 途径点稳定对象 UUID。
      schema: { type: string, format: uuid }
    RouteId:
      name: routeId
      in: path
      required: true
      description: 路线稳定对象 UUID。
      schema: { type: string, format: uuid }
    GeofenceId:
      name: geofenceId
      in: path
      required: true
      description: 电子围栏稳定对象 UUID。
      schema: { type: string, format: uuid }
    SpatialVersionId:
      name: versionId
      in: path
      required: true
      description: 空间对象版本 UUID。
      schema: { type: string, format: uuid }
    SceneAssetId:
      name: assetId
      in: path
      required: true
      description: 三维资源 UUID。
      schema: { type: string, format: uuid }
    SceneId:
      name: sceneId
      in: path
      required: true
      description: 稳定场景 UUID。
      schema: { type: string, format: uuid }
    SceneVersionId:
      name: versionId
      in: path
      required: true
      description: 场景草稿或发布版本 UUID。
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      description: 人员 UUID。
      schema: { type: string, format: uuid }
    QualificationId:
      name: qualificationId
      in: path
      required: true
      description: 司机资质 UUID。
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务操作重试时保持不变的稳定幂等键。
      schema: { type: string, minLength: 1, maxLength: 128 }
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    NotificationProviderCode:
      type: string
      enum: [smtp, wecom-robot, dingtalk-robot, feishu-robot, generic-webhook, aliyun-sms, aliyun-voice]
    NotificationChannelType:
      type: string
      enum: [EMAIL, SMS, VOICE, ENTERPRISE_IM, WEBHOOK]
    NotificationProviderFieldType:
      type: string
      enum: [STRING, INTEGER, BOOLEAN, STRING_LIST, SECRET]
    NotificationAdapterKey:
      type: object
      additionalProperties: false
      required: [channelType, provider]
      properties:
        channelType: { $ref: '#/components/schemas/NotificationChannelType' }
        provider: { $ref: '#/components/schemas/NotificationProviderCode' }
    NotificationProviderField:
      type: object
      additionalProperties: false
      required: [key, type, required, maxLength, defaultValue, options]
      properties:
        key: { type: string, pattern: '^[a-z][a-zA-Z0-9]{1,63}$' }
        type: { $ref: '#/components/schemas/NotificationProviderFieldType' }
        required: { type: boolean }
        maxLength: { type: [integer, 'null'], minimum: 1, maximum: 32768 }
        defaultValue:
          oneOf:
            - { type: string }
            - { type: integer }
            - { type: boolean }
            - { type: array, items: { type: string } }
            - { type: 'null' }
        options:
          type: array
          maxItems: 128
          items: { type: string }
    NotificationProviderDefinition:
      type: object
      additionalProperties: false
      required: [key, displayNameKey, supportsDeliveryReceipt, configurationFields, secretFields]
      properties:
        key: { $ref: '#/components/schemas/NotificationAdapterKey' }
        displayNameKey: { type: string, pattern: '^[a-z][a-zA-Z0-9.-]{2,127}$' }
        supportsDeliveryReceipt: { type: boolean }
        configurationFields:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/NotificationProviderField' }
        secretFields:
          type: array
          maxItems: 128
          items: { $ref: '#/components/schemas/NotificationProviderField' }
    NotificationChannelRequest:
      type: object
      additionalProperties: false
      required: [channelCode, name, channelType, provider, status, configuration, secrets, connectTimeoutMs, readTimeoutMs, version]
      properties:
        channelCode: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        channelType: { $ref: '#/components/schemas/NotificationChannelType' }
        provider: { $ref: '#/components/schemas/NotificationProviderCode' }
        status: { type: string, enum: [ENABLED, DISABLED] }
        configuration:
          type: object
          maxProperties: 128
          additionalProperties: true
        secrets:
          type: object
          writeOnly: true
          maxProperties: 128
          additionalProperties: { type: string, maxLength: 8192 }
        connectTimeoutMs: { type: integer, minimum: 100, maximum: 30000 }
        readTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
        version: { type: integer, format: int64, minimum: 0 }
    NotificationChannelResponse:
      type: object
      additionalProperties: false
      required: [id, channelCode, name, channelType, provider, status, configuration, secretConfigured, connectTimeoutMs, readTimeoutMs, lastVerifiedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        channelCode: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        channelType: { $ref: '#/components/schemas/NotificationChannelType' }
        provider: { $ref: '#/components/schemas/NotificationProviderCode' }
        status: { type: string, enum: [ENABLED, DISABLED] }
        configuration: { type: object, maxProperties: 128, additionalProperties: true }
        secretConfigured: { type: boolean }
        connectTimeoutMs: { type: integer, minimum: 100, maximum: 30000 }
        readTimeoutMs: { type: integer, minimum: 100, maximum: 60000 }
        lastVerifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    MineArchiveStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    MineArchiveRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    MineOrganizationRequest:
      type: object
      additionalProperties: false
      required: [organizationCode, name]
      properties:
        organizationCode: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
    MineOrganizationUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, format: int64, minimum: 0 }
    MineOrganizationResponse:
      type: object
      required: [id, organizationCode, name, status, archivedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationCode: { type: string }
        name: { type: string }
        status: { $ref: '#/components/schemas/MineArchiveStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    MineOrganizationPage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MineOrganizationResponse' } }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    MineSiteRequest:
      type: object
      additionalProperties: false
      required: [siteCode, name, timezone]
      properties:
        siteCode: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        timezone: { type: string, minLength: 1, maxLength: 64, description: IANA 时区名。 }
        description: { type: [string, 'null'], maxLength: 500 }
    MineSiteUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, timezone, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    MineSiteResponse:
      type: object
      required: [id, organizationId, siteCode, name, timezone, description, status, archivedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        siteCode: { type: string }
        name: { type: string }
        timezone: { type: string }
        description: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/MineArchiveStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    MineSitePage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MineSiteResponse' } }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    MineOrganizationContext:
      type: object
      required: [organization, organizationWide, sites]
      properties:
        organization: { $ref: '#/components/schemas/MineOrganizationResponse' }
        organizationWide: { type: boolean }
        sites: { type: array, items: { $ref: '#/components/schemas/MineSiteResponse' } }
    MineContextResponse:
      type: object
      required: [organizations]
      properties:
        organizations: { type: array, items: { $ref: '#/components/schemas/MineOrganizationContext' } }
    MineScopeGrantRequest:
      type: object
      additionalProperties: false
      required: [userId, organizationId]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        siteId:
          type: [string, 'null']
          format: uuid
          description: null 表示组织级全矿区授权。
    MineScopeGrantResponse:
      type: object
      required: [id, userId, organizationId, siteId, grantedAt, grantedBy]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        siteId: { type: [string, 'null'], format: uuid }
        grantedAt: { type: string, format: date-time }
        grantedBy: { type: string, format: uuid }
    VehicleType:
      type: string
      enum: [HAUL_TRUCK, EXCAVATOR, LOADER, DRILL, DOZER, WATER_TRUCK, LIGHT_VEHICLE, OTHER]
    VehicleStatus:
      type: string
      enum: [ACTIVE, MAINTENANCE, OUT_OF_SERVICE, ARCHIVED]
    VehicleRequest:
      type: object
      additionalProperties: false
      required: [vehicleCode, name, vehicleType]
      properties:
        vehicleCode: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{1,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        mineNumber: { type: [string, 'null'], maxLength: 64 }
        licensePlate: { type: [string, 'null'], maxLength: 32 }
        brand: { type: [string, 'null'], maxLength: 64 }
        model: { type: [string, 'null'], maxLength: 64 }
        ratedLoadTons: { type: [number, 'null'], exclusiveMinimum: 0 }
    VehicleUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, vehicleType, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        mineNumber: { type: [string, 'null'], maxLength: 64 }
        licensePlate: { type: [string, 'null'], maxLength: 32 }
        brand: { type: [string, 'null'], maxLength: 64 }
        model: { type: [string, 'null'], maxLength: 64 }
        ratedLoadTons: { type: [number, 'null'], exclusiveMinimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
    VehicleResponse:
      type: object
      required: [id, organizationId, siteId, vehicleCode, name, vehicleType, mineNumber, licensePlate, brand, model, ratedLoadTons, status, archivedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        vehicleCode: { type: string }
        name: { type: string }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        mineNumber: { type: [string, 'null'] }
        licensePlate: { type: [string, 'null'] }
        brand: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        ratedLoadTons: { type: [number, 'null'] }
        status: { $ref: '#/components/schemas/VehicleStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    VehiclePage:
      type: object
      required: [items, page, size, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/VehicleResponse' } }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    LocationTagStatus:
      type: string
      enum: [ACTIVE, LOST, RETIRED, ARCHIVED]
    LocationTagRequest:
      type: object
      additionalProperties: false
      required: [tagCode]
      properties:
        tagCode: { type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{1,63}$' }
        vendor: { type: [string, 'null'], maxLength: 128 }
        model: { type: [string, 'null'], maxLength: 64 }
        batteryPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        batteryObservedAt: { type: [string, 'null'], format: date-time }
    LocationTagUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        vendor: { type: [string, 'null'], maxLength: 128 }
        model: { type: [string, 'null'], maxLength: 64 }
        batteryPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        batteryObservedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    LocationTagResponse:
      type: object
      required: [id, organizationId, siteId, tagCode, vendor, model, batteryPercent, batteryObservedAt, status, archivedAt, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        tagCode: { type: string }
        vendor: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        batteryPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        batteryObservedAt: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/LocationTagStatus' }
