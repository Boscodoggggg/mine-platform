      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - name: closed
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlarmStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/AlarmSeverity' }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
