      parameters:
        - $ref: '#/components/parameters/ProtocolVersionId'
      responses:
        '200':
          description: 本次不可变测试运行和逐样本结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtocolTestRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /config-releases:
    get:
      tags: [ProtocolConfiguration]
      operationId: listConfigReleases
