openapi: 3.1.0
info:
  title: 智慧矿山平台 API
  version: 0.1.0
  description: |
    智慧矿山平台对管理端开放的 REST 契约。本文件固化阶段 1 已实现的产品、设备台账和遥测查询接口。
    所有时间均为带时区的 ISO-8601 UTC 时间。命令中心只开放已发布的低风险命令模板。
servers:
  - url: /api/v1
security:
  - MineToken: []
tags:
  - name: OperationsDashboard
    description: 调度员和值班人员生产运行总览
  - name: SystemOperations
    description: 系统管理员按需运行状态检查
  - name: SystemConfiguration
    description: 菜单、权限节点和通用字典在线管理
  - name: DeviceRegistry
    description: 产品和设备台账管理
  - name: DeviceModel
    description: 物模型字段和厂商协议映射版本管理
  - name: DeviceTelemetry
    description: 设备最新值与数值遥测历史
  - name: CommandCenter
    description: 设备命令下发与可靠状态时间线
paths:
  /dashboard/operations:
    get:
      tags: [OperationsDashboard]
      operationId: getOperationsDashboard
      summary: 查询矿区调度运行总览
      description: |
        返回启用设备、数据新鲜度、今日接收消息、二十四小时趋势和需要关注的设备。
        遥测库不可用时，dataStatus 为 UNAVAILABLE，相关数字返回 null，不会用零值伪装查询失败。
      responses:
        '200':
          description: 调度运行总览。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /system/operations:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperations
      summary: 按需检查平台运行状态
      description: |
        仅在用户进入运行监控页面或主动刷新时执行，不启动后台轮询。
        需要 system:operations:view 权限，响应不包含连接串、凭据或异常堆栈。
      responses:
        '200':
          description: 平台服务、消息和存储依赖的脱敏状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemOperationsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/operations/overview:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperationsOverview
      summary: 查询平台运行历史总览
      description: |
        通过服务端固定 PromQL 模板查询 Prometheus，不接受调用方传入任意查询表达式。
        Prometheus 未启用或不可用时 dataStatus 为 UNAVAILABLE，各检查项状态为 UNKNOWN。
      parameters:
        - name: range
          in: query
          schema:
            $ref: '#/components/schemas/OperationsObservabilityRange'
      responses:
        '200':
          description: 平台运行历史聚合结论。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsObservabilityOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/operations/items/{key}/check:
    get:
      tags: [SystemOperations]
      operationId: checkSystemOperation
      summary: 独立执行单个运行检查项
      description: |
        供运行监控页面并发调用，单个检查项完成后即可独立展示结果。
        每次调用只执行指定检查项，并受服务端统一超时限制。
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 单个检查项的即时脱敏结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemOperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperationItemNotFound' }
  /system/operations/items/{key}/series:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperationSeries
      summary: 查询单个运行检查项趋势
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          schema:
            $ref: '#/components/schemas/OperationsObservabilityRange'
      responses:
        '200':
          description: 单个检查项的真实状态与延迟采样点。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsObservabilitySeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/tree:
    get:
      tags: [SystemConfiguration]
      operationId: getManagedMenuTree
      summary: 查询菜单与按钮权限树
      responses:
        '200':
          description: 完整菜单树，供菜单维护和角色授权复用。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedMenuNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/component-options:
    get:
      tags: [SystemConfiguration]
      operationId: listMenuComponentOptions
      summary: 查询允许配置的前端页面组件
      responses:
        '200':
          description: 编译期注册的页面组件白名单。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuComponentOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/{menuId}/buttons:
    get:
      tags: [SystemConfiguration]
      operationId: listManagedMenuButtons
      summary: 按需查询页面的按钮权限
      parameters:
        - name: menuId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 页面的直接按钮权限节点。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedMenuNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/batch-delete:
    post:
      tags: [SystemConfiguration]
      operationId: batchDeleteManagedMenus
      summary: 原子批量删除菜单节点
      description: |
        整批校验核心节点、角色引用和子节点约束；任一节点不允许删除时不执行任何删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuBatchDeleteRequest' }
      responses:
        '204': { description: 选中的菜单节点已删除。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/menus:
    get:
      tags: [SystemConfiguration]
      operationId: listManagedMenus
      summary: 按父节点分页查询菜单树表格
      description: |
        不传 parentId 时查询根目录；展开目录时传入该目录标识，只返回直接子目录和页面。
        筛选条件命中后会保留命中节点的祖先链，便于仍按树层级展开。
      parameters:
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Keyword'
        - name: type
          in: query
          schema: { type: string, enum: [DIRECTORY, MENU] }
        - name: status
          in: query
          schema: { type: string, enum: [ENABLED, DISABLED] }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: 当前父节点下的菜单节点分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createManagedMenu
      summary: 创建目录、页面或按钮权限节点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuSaveRequest' }
      responses:
        '201':
          description: 菜单节点已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/menus/{menuId}:
    parameters:
      - name: menuId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateManagedMenu
      summary: 修改菜单节点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuSaveRequest' }
      responses:
        '200':
          description: 修改后的菜单节点。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteManagedMenu
      summary: 删除未被引用的非保护菜单节点
      responses:
        '204': { description: 菜单节点已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries:
    get:
      tags: [SystemConfiguration]
      operationId: listDictionaryTypes
      summary: 查询全部通用字典类型
      responses:
        '200':
          description: 字典类型列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createDictionaryType
      summary: 创建通用字典类型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryTypeCreateRequest' }
      responses:
        '200':
          description: 字典类型已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/{dictionaryTypeId}:
    parameters:
      - name: dictionaryTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateDictionaryType
      summary: 修改字典类型的可变信息
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryTypeUpdateRequest' }
      responses:
        '200':
          description: 修改后的字典类型。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteDictionaryType
      summary: 删除空的非内置字典类型
      responses:
        '204': { description: 字典类型已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/{dictionaryTypeId}/items:
    parameters:
      - name: dictionaryTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SystemConfiguration]
      operationId: listDictionaryItems
      summary: 查询字典类型下的全部数据项
      responses:
        '200':
          description: 字典数据项列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createDictionaryItem
      summary: 创建字典数据项
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryItemCreateRequest' }
      responses:
        '200':
          description: 字典数据项已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/items/{dictionaryItemId}:
    parameters:
      - name: dictionaryItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateDictionaryItem
      summary: 修改字典数据项的可变信息
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryItemUpdateRequest' }
      responses:
        '200':
          description: 修改后的字典数据项。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteDictionaryItem
      summary: 删除字典数据项
      responses:
        '204': { description: 字典数据项已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dictionaries/{dictionaryCode}/items:
    get:
      tags: [SystemConfiguration]
      operationId: listEnabledDictionaryItems
      summary: 按稳定编码查询启用字典项
      parameters:
        - name: dictionaryCode
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
      responses:
        '200':
          description: 可供业务页面使用的启用字典项。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /device-models/products/{productId}/configuration:
    get:
      tags: [DeviceModel]
      operationId: getProductDeviceConfiguration
      summary: 查询产品的物模型与协议映射版本
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 产品全部物模型和协议映射版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDeviceConfiguration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
  /device-models/products/{productId}/model-drafts:
    post:
      tags: [DeviceModel]
      operationId: createDeviceModelDraft
      summary: 创建空物模型草稿版本
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DescriptionRequest' }
      responses:
        '200':
          description: 新建的物模型草稿版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
  /device-models/model-versions/{modelVersionId}/fields:
    put:
      tags: [DeviceModel]
      operationId: replaceDeviceModelFields
      summary: 原子替换物模型草稿的全部字段
      parameters:
        - name: modelVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceModelFieldsRequest' }
      responses:
        '200':
          description: 保存后的物模型字段。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceModelField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/model-versions/{modelVersionId}/publish:
    post:
      tags: [DeviceModel]
      operationId: publishDeviceModelVersion
      summary: 发布物模型草稿并退役旧发布版本
      parameters:
        - name: modelVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '204': { description: 物模型版本已发布。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/products/{productId}/protocol-drafts:
    post:
      tags: [DeviceModel]
      operationId: createProtocolMappingDraft
      summary: 创建厂商协议字段映射草稿
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolMappingDraftRequest' }
      responses:
        '200':
          description: 新建的协议映射草稿版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtocolMappingVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /device-models/protocol-versions/{protocolVersionId}/fields:
    put:
      tags: [DeviceModel]
      operationId: replaceProtocolMappingFields
      summary: 原子替换协议草稿的全部字段映射
      parameters:
        - name: protocolVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolMappingFieldsRequest' }
      responses:
        '200':
          description: 保存后的协议字段映射。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProtocolMappingField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/protocol-versions/{protocolVersionId}/publish:
    post:
      tags: [DeviceModel]
      operationId: publishProtocolMappingVersion
      summary: 发布协议映射草稿并退役旧发布版本
      parameters:
        - name: protocolVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '204': { description: 协议映射版本已发布。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /command-templates:
    get:
      tags: [CommandCenter]
      operationId: listCommandTemplates
      summary: 查询可下发命令模板
      responses:
        '200':
          description: 已发布的低风险命令模板。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommandTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /command-targets:
    get:
      tags: [CommandCenter]
      operationId: listCommandTargets
      summary: 分页查询可接收命令的启用设备
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: 命令目标设备分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /commands:
    get:
      tags: [CommandCenter]
      operationId: listCommands
      summary: 分页查询命令
      parameters:
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CommandStatus' }
        - name: templateKey
          in: query
          schema: { type: string, maxLength: 128 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 命令分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CommandCenter]
      operationId: createCommand
      summary: 幂等创建并下发命令
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '201':
          description: 命令已创建并进入可靠出站队列。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /commands/{commandId}:
    get:
      tags: [CommandCenter]
      operationId: getCommand
      summary: 查询命令详情与状态时间线
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: 命令详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommandNotFound' }
  /commands/{commandId}/cancel:
    post:
      tags: [CommandCenter]
      operationId: cancelCommand
      summary: 取消尚未开始发送的排队命令
      parameters:
        - $ref: '#/components/parameters/CommandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, reason]
              properties:
                version: { type: integer, format: int64, minimum: 0 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 命令已取消。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/CommandNotFound' }
  /products:
    get:
      tags: [DeviceRegistry]
      operationId: listProducts
      summary: 分页查询产品
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 产品分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceRegistry]
      operationId: createProduct
      summary: 创建产品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: 产品已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}:
    put:
      tags: [DeviceRegistry]
      operationId: updateProduct
      summary: 修改产品
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: 修改后的产品。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}/archive:
    post:
      tags: [DeviceRegistry]
      operationId: archiveProduct
      summary: 归档产品
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '204': { description: 产品已归档。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices:
    get:
      tags: [DeviceRegistry]
      operationId: listDevices
      summary: 分页查询设备
      parameters:
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            type: string
            enum: [ENABLED, DISABLED, ARCHIVED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 设备分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceRegistry]
      operationId: createDevice
      summary: 创建设备
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: 设备已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}:
    put:
      tags: [DeviceRegistry]
      operationId: updateDevice
      summary: 修改设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: 修改后的设备。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}/archive:
    post:
      tags: [DeviceRegistry]
      operationId: archiveDevice
      summary: 归档设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '204': { description: 设备已归档。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/access-status:
    get:
      tags: [DeviceRegistry]
      operationId: listDeviceAccessStatuses
      summary: 批量查询设备持续接入状态
      parameters:
        - name: deviceIds
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: 与请求设备对应的持续接入状态。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceAccessStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /devices/{deviceId}/access-status/test:
    post:
      tags: [DeviceRegistry]
      operationId: testDeviceAccessStatus
      summary: 手动执行设备四层接入检查
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 端点、传输、活动和数据四层检查结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceAccessTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
  /devices/{deviceId}/connection-profile:
    get:
      tags: [DeviceRegistry]
      operationId: getDeviceConnectionProfile
      summary: 查询设备接入配置与最近诊断结果
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 设备接入配置，不包含任何明文凭据。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConnectionProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
    put:
      tags: [DeviceRegistry]
      operationId: saveDeviceConnectionProfile
      summary: 创建或更新设备接入配置
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceConnectionProfileRequest' }
      responses:
        '200':
          description: 保存后的设备接入配置。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConnectionProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}/connection-profile/test:
    post:
      tags: [DeviceRegistry]
      operationId: testDeviceConnectionProfile
      summary: 执行设备接入端点分层连通性诊断
      description: |
        依次验证配置、DNS、TCP 和可选 TLS。对于设备主动接入平台的模式，成功只表示平台端点可用，
        仍必须等待真实设备连接和首帧数据才能确认设备已经上线。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: 本次诊断结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConnectionTestResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
  /devices/{deviceId}/latest:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceLatestTelemetry
      summary: 查询设备指定属性的最新值
      description: |
        需要 `device:telemetry:view` 权限。优先读取 Redis；缓存缺失时按设备和属性键合并并发请求，
        从 TimescaleDB 回源最近历史并使用 HSETNX 回填，避免旧历史覆盖并发到达的新数据。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyIds
          in: query
          required: true
          description: 传入数量为 1 至 100；服务去重后按首次出现顺序返回。
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/PropertyId'
      responses:
        '200':
          description: 最新值快照；没有历史的属性出现在 missingPropertyIds。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLatest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /devices/{deviceId}/telemetry:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceTelemetryHistory
      summary: 分页查询设备单个数值属性历史
      description: |
        需要 `device:telemetry:view` 权限。时间范围采用 `[from, to)`；RAW 最多查询 7 天且不能传 bucket；
        AVG、MIN、MAX 最多查询 366 天，bucket 必须在 1 分钟至 24 小时之间且最多产生 10000 个桶。
        bucket 只接受整秒精度。聚合结果的 quality 取桶内最差质量，sampleCount 表示桶内样本数；
        分页 offset 不得超过 1000000。首页可省略 watermark，响应会返回数据库已提交事件的摄取水位；
        后续页必须原样传回，以排除 RabbitMQ 积压、数据库重试和弱网迟到点在翻页期间造成的重复或遗漏。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PropertyId'
        - name: from
          in: query
          required: true
          description: 开始时间，包含。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间，不包含。
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [RAW, AVG, MIN, MAX]
            default: RAW
        - name: bucket
          in: query
          description: 聚合时间桶，使用 ISO-8601 Duration，例如 PT5M；RAW 查询不能传入。
          schema:
            type: string
            format: duration
        - name: watermark
          in: query
          description: 分页数据集的全局摄取水位上限；首页省略，后续页传回首页响应中的 watermark，不得大于服务端当前已提交水位。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 原始遥测点或聚合时间桶分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
components:
  securitySchemes:
    MineToken:
      type: apiKey
      in: header
      name: X-Mine-Token
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 设备 UUID。
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      description: 命令 UUID。
      schema:
        type: string
        format: uuid
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    SystemOperationStatus:
      type: string
      enum: [UP, DEGRADED, DOWN, UNKNOWN]
    SystemOperationCategory:
      type: string
      enum: [SERVICE, MESSAGE, STORAGE, OTHER]
    SystemOperationsOverview:
      type: object
      required: [status, checkedAt, items]
      properties:
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        checkedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemOperationItem' }
    SystemOperationItem:
      type: object
      required: [key, category, status, latencyMillis, summary]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        latencyMillis: { type: integer, format: int64, minimum: 0 }
        summary: { type: string }
    OperationsObservabilityDataStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    OperationsObservabilityRange:
      type: string
      enum: [1h, 6h, 24h, 7d, 15d]
      default: 24h
    OperationsObservabilityOverview:
      type: object
      required: [dataStatus, range, generatedAt, status, healthy, degraded, down, unknown, items]
      properties:
        dataStatus: { $ref: '#/components/schemas/OperationsObservabilityDataStatus' }
        range: { $ref: '#/components/schemas/OperationsObservabilityRange' }
        generatedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        healthy: { type: integer, format: int64, minimum: 0 }
        degraded: { type: integer, format: int64, minimum: 0 }
        down: { type: integer, format: int64, minimum: 0 }
        unknown: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationsObservabilityItem' }
    OperationsObservabilityItem:
      type: object
      required: [key, category, status, availabilityPercent, averageLatencyMillis, p95LatencyMillis, lastChangedAt, sampleCount]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        availabilityPercent: { type: [number, 'null'], format: double, minimum: 0, maximum: 100 }
        averageLatencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        p95LatencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        lastChangedAt: { type: [string, 'null'], format: date-time }
        sampleCount: { type: integer, format: int64, minimum: 0 }
    OperationsObservabilitySeries:
      type: object
      required: [key, category, dataStatus, range, generatedAt, points]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        dataStatus: { $ref: '#/components/schemas/OperationsObservabilityDataStatus' }
        range: { $ref: '#/components/schemas/OperationsObservabilityRange' }
        generatedAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/OperationsObservabilityPoint' }
    OperationsObservabilityPoint:
      type: object
      required: [time, status, latencyMillis]
      properties:
        time: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        latencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
    DashboardDataStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    DashboardDeviceState:
      type: string
      enum: [STALE, NEVER_REPORTED]
    OperationsOverview:
      type: object
      required: [generatedAt, dataStatus, freshnessSeconds, devices, telemetry, attentionDevices]
      properties:
        generatedAt: { type: string, format: date-time }
        dataStatus: { $ref: '#/components/schemas/DashboardDataStatus' }
        freshnessSeconds: { type: integer, minimum: 1 }
        devices: { $ref: '#/components/schemas/DashboardDeviceSummary' }
        telemetry: { $ref: '#/components/schemas/DashboardTelemetrySummary' }
        attentionDevices:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/DashboardAttentionDevice' }
    DashboardDeviceSummary:
      type: object
      required: [enabled]
      properties:
        enabled: { type: integer, format: int64, minimum: 0 }
        reporting: { type: [integer, 'null'], format: int64, minimum: 0 }
        stale: { type: [integer, 'null'], format: int64, minimum: 0 }
        neverReported: { type: [integer, 'null'], format: int64, minimum: 0 }
    DashboardTelemetrySummary:
      type: object
      required: [hourly]
      properties:
        todayMessages: { type: [integer, 'null'], format: int64, minimum: 0 }
        latestReceivedAt: { type: [string, 'null'], format: date-time }
        hourly:
          type: array
          items: { $ref: '#/components/schemas/DashboardHourBucket' }
    DashboardHourBucket:
      type: object
      required: [hour, count]
      properties:
        hour: { type: string, format: date-time }
        count: { type: integer, format: int64, minimum: 0 }
    DashboardAttentionDevice:
      type: object
      required: [deviceId, deviceCode, name, state]
      properties:
        deviceId: { type: string, format: uuid }
        deviceCode: { type: string }
        name: { type: string }
        state: { $ref: '#/components/schemas/DashboardDeviceState' }
        lastSeenAt: { type: [string, 'null'], format: date-time }
    CommandStatus:
      type: string
      enum: [CREATED, QUEUED, SENT, DEVICE_RECEIVED, SUCCEEDED, REFUSED, FAILED, EXPIRED, TIMEOUT, CANCELLED]
    CommandRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    ManagedMenuNode:
      type: object
      required:
        - id
        - name
        - type
        - sortOrder
        - visible
        - status
