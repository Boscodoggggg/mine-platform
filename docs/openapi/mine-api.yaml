  /mine/sites/{siteId}/operation-summary:
    get:
      tags: [MineOperation]
      operationId: getMineOperationSummary
      summary: 查询生产运营汇总和车辆人员维度
      description: |
        需要 mine:operation:view 权限。营业日期窗口最长 31 天，跨午夜按班次营业日期归集；
        作废记录排除，异常终止单独统计，吨位未知返回 null 而真实零吨保持 0。
        任一纳入作业单的计划趟数未知时，整体完成率返回 null，避免错误放大。
        车辆利用率按有效循环时长除以该车参与班次的去重开放时长计算。
        作业单、车辆和司机明细维度各最多五百条，超限时 breakdownsTruncated 为 true。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: 生产计划、有效产量、阶段时长、车辆利用率和司机作业量。, content: { application/json: { schema: { $ref: '#/components/schemas/OperationSummaryResponse' } } } }
