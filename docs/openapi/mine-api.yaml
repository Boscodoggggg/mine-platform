        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/CommandNotFound' }
  /alarms:
    get:
      tags: [AlarmCenter]
      operationId: listAlarms
      summary: 组合过滤并分页查询告警周期
      description: |
        status 由触发、恢复、确认和关闭事实实时推导；active=true 只返回尚未恢复的告警，
        closed=false 返回全部未关闭告警并包含恢复未确认事实。
        查询结果按触发时间和告警标识倒序排列。
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
        - name: closed
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlarmStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/AlarmSeverity' }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: deviceKeyword
          in: query
          description: 按设备编码或设备名称模糊匹配，不需要设备台账权限。
          schema: { type: string, maxLength: 128 }
        - name: ruleKey
          in: query
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: 触发时间范围起点，包含。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 触发时间范围终点，不包含。
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: 告警周期分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /mine/sites/{siteId}/alarms:
    get:
      tags: [MineScene]
      operationId: listMineSiteAlarms
      summary: 查询矿区车载设备告警
      description: |
        只返回告警触发时通过有效车辆设备绑定归属当前矿区的告警，
        并在查询前校验当前用户的矿区作用域。全局告警中心仍使用 /alarms。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - name: active
          in: query
          schema: { type: boolean }
        - name: closed
          in: query
          schema: { type: boolean }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AlarmStatus' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/AlarmSeverity' }
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: deviceKeyword
          in: query
          description: 按设备编码或设备名称模糊匹配。
          schema: { type: string, maxLength: 128 }
        - name: ruleKey
          in: query
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: 触发时间范围起点，包含。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 触发时间范围终点，不包含。
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
      responses:
        '200':
          description: 矿区车载设备告警分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlarmPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alarms/{alarmId}:
    get:
      tags: [AlarmCenter]
      operationId: getAlarm
      summary: 查询告警周期完整事实
      parameters:
        - $ref: '#/components/parameters/AlarmId'
      responses:
        '200':
          description: 告警详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }
  /alarms/{alarmId}/acknowledgements:
    post:
      tags: [AlarmCenter]
      operationId: acknowledgeAlarm
      summary: 幂等记录首次告警确认事实
      description: 已确认告警再次请求时返回当前事实，不重复写确认或操作审计。
      parameters:
        - $ref: '#/components/parameters/AlarmId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmDispositionRequest' }
      responses:
        '200':
          description: 确认后的告警事实。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /alarms/{alarmId}/close:
    post:
      tags: [AlarmCenter]
      operationId: closeAlarm
      summary: 幂等关闭已经恢复的告警
      description: 活动告警不能关闭；关闭只改变处置事实，不覆盖触发、恢复和确认时间线。
      parameters:
        - $ref: '#/components/parameters/AlarmId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlarmDispositionRequest' }
      responses:
        '200':
          description: 关闭后的告警事实。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AlarmNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products:
