name: mine-standalone

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-java-service: &java-service
  image: ${MINE_JAVA_IMAGE:-eclipse-temurin:21.0.7_6-jre-jammy}
  restart: unless-stopped
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  nginx:
    image: ${MINE_NGINX_IMAGE:-nginx:1.29.0-alpine}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MINE_HTTPS_PORT:-443}:443"
    volumes:
      - ../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MINE_WEB_DIST_PATH:-../../mine-web/dist}:/usr/share/nginx/html:ro
    secrets:
      - source: tls_certificate
        target: tls_certificate
      - source: tls_private_key
        target: tls_private_key
    tmpfs:
      - /var/cache/nginx:size=64m,uid=101,gid=101
      - /var/run:size=8m,uid=101,gid=101
    depends_on:
      mine-server:
        condition: service_healthy
    networks:
      - ingress
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O- https://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
    logging: *default-logging

  mine-server:
    <<: *java-service
    command:
      - /bin/bash
      - -ec
      - |
        export SPRING_DATASOURCE_PASSWORD="$$(cat /run/secrets/postgres_password)"
        export SPRING_DATA_REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        exec java $${JAVA_OPTS:-} -jar /opt/mine/app.jar
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mine}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mine}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINE_MANAGEMENT_ADDRESS: 0.0.0.0
      MINE_BOOTSTRAP_ADMIN_ENABLED: "true"
      MINE_BOOTSTRAP_ADMIN_ID: ${MINE_BOOTSTRAP_ADMIN_ID:-0198aef6-2e80-7000-8000-000000000001}
      MINE_BOOTSTRAP_ADMIN_USERNAME: ${MINE_BOOTSTRAP_ADMIN_USERNAME:-mine-admin}
      MINE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${MINE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-矿区超级管理员}
      MINE_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/mine_super_admin_password
      MINE_PASSWORD_BCRYPT_STRENGTH: ${MINE_PASSWORD_BCRYPT_STRENGTH:-12}
      MINE_AUTH_ACTIVE_TIMEOUT_SECONDS: ${MINE_AUTH_ACTIVE_TIMEOUT_SECONDS:-1800}
      MINE_RABBITMQ_ADMIN_BASE_URL: http://rabbitmq:15672
      MINE_RABBITMQ_ADMIN_USERNAME_FILE: /run/secrets/rabbitmq_admin_username
      MINE_RABBITMQ_ADMIN_PASSWORD_FILE: /run/secrets/rabbitmq_admin_password
      MINE_TELEMETRY_QUERY_ENABLED: "true"
      MINE_TELEMETRY_QUERY_URL: jdbc:postgresql://timescale:5432/${TIMESCALE_DB:-mine_telemetry}
      MINE_TELEMETRY_QUERY_USERNAME: ${TIMESCALE_READER_USER:-mine_ts_reader}
      MINE_TELEMETRY_QUERY_PASSWORD_FILE: /run/secrets/timescale_reader_password
    volumes:
      - ../../mine-server/target/mine-server-0.1.0-SNAPSHOT.jar:/opt/mine/app.jar:ro
    secrets:
      - postgres_password
      - redis_password
      - mine_super_admin_password
      - rabbitmq_admin_username
      - rabbitmq_admin_password
      - timescale_reader_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      timescale:
        condition: service_healthy
      timescale-reader-bootstrap:
        condition: service_completed_successfully
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18080; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  mine-gateway:
    <<: *java-service
    command: ["java", "-XX:MaxRAMPercentage=75", "-XX:+ExitOnOutOfMemoryError", "-Duser.timezone=UTC", "-jar", "/opt/mine/app.jar"]
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
      MINE_MANAGEMENT_ADDRESS: 0.0.0.0
      MINE_GATEWAY_RABBIT_ENABLED: "true"
      MINE_GATEWAY_RABBIT_HOST: rabbitmq
      MINE_GATEWAY_DEVICE_RABBIT_PASSWORD_FILE: /run/secrets/rabbitmq_gateway_device_password
      MINE_GATEWAY_PLATFORM_RABBIT_PASSWORD_FILE: /run/secrets/rabbitmq_gateway_platform_password
      MINE_GATEWAY_IDENTITY_SNAPSHOT_FILE: /etc/mine/gateway/device-identities.json
    volumes:
      - ../../mine-gateway/target/mine-gateway-0.1.0-SNAPSHOT.jar:/opt/mine/app.jar:ro
      - ../config/gateway/device-identities.json:/etc/mine/gateway/device-identities.json:ro
    secrets:
      - rabbitmq_gateway_device_password
      - rabbitmq_gateway_platform_password
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18081; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  mine-telemetry:
    <<: *java-service
    command:
      - /bin/bash
      - -ec
      - |
        export SPRING_DATASOURCE_PASSWORD="$$(cat /run/secrets/timescale_password)"
        export SPRING_DATA_REDIS_PASSWORD="$$(cat /run/secrets/redis_password)"
        exec java $${JAVA_OPTS:-} -jar /opt/mine/app.jar
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescale:5432/${TIMESCALE_DB:-mine_telemetry}
      SPRING_DATASOURCE_USERNAME: ${TIMESCALE_USER:-mine_ts}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINE_TELEMETRY_RABBIT_ENABLED: "true"
      MINE_TELEMETRY_RABBIT_HOST: rabbitmq
      MINE_TELEMETRY_RABBIT_PASSWORD_FILE: /run/secrets/rabbitmq_telemetry_password
      MINE_MANAGEMENT_ADDRESS: 0.0.0.0
    volumes:
      - ../../mine-telemetry/target/mine-telemetry-0.1.0-SNAPSHOT.jar:/opt/mine/app.jar:ro
    secrets:
      - timescale_password
      - redis_password
      - rabbitmq_telemetry_password
    depends_on:
      rabbitmq:
        condition: service_healthy
      timescale:
        condition: service_healthy
      timescale-reader-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/18082; printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3; grep -q \"200\" <&3'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  rabbitmq:
    image: ${MINE_RABBITMQ_IMAGE:-rabbitmq:4.1.8-management}
    hostname: rabbitmq
    restart: unless-stopped
    init: true
    command:
      - /bin/bash
      - -ec
      - |
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq
        exec gosu rabbitmq /opt/mine/rabbitmq-bootstrap.sh
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MINE_MQTTS_PORT:-8883}:8883"
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ../config/rabbitmq/rabbitmq-standalone.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ../config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../scripts/rabbitmq-bootstrap.sh:/opt/mine/rabbitmq-bootstrap.sh:ro
    secrets:
      - rabbitmq_admin_username
      - rabbitmq_admin_password
      - rabbitmq_gateway_device_password
      - rabbitmq_gateway_platform_password
      - rabbitmq_telemetry_password
      - source: tls_certificate
        target: tls_certificate
      - source: tls_private_key
        target: tls_private_key
    networks:
      - ingress
      - app
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/mine-rabbitmq-bootstrap-complete && rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging

  postgres:
    image: ${MINE_POSTGRES_IMAGE:-postgres:18.4-alpine}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-mine}
      POSTGRES_USER: ${POSTGRES_USER:-mine}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging

  timescale:
    image: ${MINE_TIMESCALE_IMAGE:-timescale/timescaledb:2.28.2-pg18-oss@sha256:8ed8d7336f00a3a90bb6fe709d506172012c7e673e0cf71465491d06e2db5fbd}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${MINE_TIMEZONE:-Asia/Shanghai}
      POSTGRES_DB: ${TIMESCALE_DB:-mine_telemetry}
      POSTGRES_USER: ${TIMESCALE_USER:-mine_ts}
      POSTGRES_PASSWORD_FILE: /run/secrets/timescale_password
      TIMESCALE_READER_USER: ${TIMESCALE_READER_USER:-mine_ts_reader}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ../config/timescale/init.sql:/docker-entrypoint-initdb.d/010-timescale.sql:ro
      - ../scripts/timescale-reader-init.sh:/docker-entrypoint-initdb.d/020-timescale-reader-init.sh:ro
    secrets:
      - timescale_password
      - timescale_reader_password
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SHOW timescaledb.license' | grep -qx apache"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging

  timescale-reader-bootstrap:
    image: ${MINE_TIMESCALE_IMAGE:-timescale/timescaledb:2.28.2-pg18-oss@sha256:8ed8d7336f00a3a90bb6fe709d506172012c7e673e0cf71465491d06e2db5fbd}
    restart: "no"
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["/opt/mine/timescale-reader-init.sh"]
    environment:
      PGHOST: timescale
      POSTGRES_DB: ${TIMESCALE_DB:-mine_telemetry}
      POSTGRES_USER: ${TIMESCALE_USER:-mine_ts}
      TIMESCALE_READER_USER: ${TIMESCALE_READER_USER:-mine_ts_reader}
    volumes:
      - ../scripts/timescale-reader-init.sh:/opt/mine/timescale-reader-init.sh:ro
    secrets:
      - timescale_password
      - timescale_reader_password
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    logging: *default-logging

  redis:
    image: ${MINE_REDIS_IMAGE:-redis:8.2-alpine}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes
        --requirepass "$$(cat /run/secrets/redis_password)"
        --maxmemory "$${MINE_REDIS_MAXMEMORY}"
        --maxmemory-policy noeviction
    environment:
      MINE_REDIS_MAXMEMORY: ${MINE_REDIS_MAXMEMORY:-384mb}
    volumes:
      - redis_data:/data
    secrets:
      - redis_password
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging: *default-logging

  postgres-exporter:
    image: ${MINE_POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.19.1}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-mine}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-mine}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ../config/postgres-exporter/postgres_exporter.yml:/etc/postgres-exporter/postgres_exporter.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
      - observability
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    logging: *default-logging

  timescale-exporter:
    image: ${MINE_POSTGRES_EXPORTER_IMAGE:-prometheuscommunity/postgres-exporter:v0.19.1}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    command: ["--config.file=/etc/postgres-exporter/postgres_exporter.yml"]
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_URI: timescale:5432/${TIMESCALE_DB:-mine_telemetry}?sslmode=disable
      DATA_SOURCE_USER: ${TIMESCALE_USER:-mine_ts}
      DATA_SOURCE_PASS_FILE: /run/secrets/timescale_password
    secrets:
      - timescale_password
    volumes:
      - ../config/postgres-exporter/postgres_exporter.yml:/etc/postgres-exporter/postgres_exporter.yml:ro
    depends_on:
      timescale:
        condition: service_healthy
    networks:
      - data
      - observability
    healthcheck:
      test: ["CMD", "/bin/postgres_exporter", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    logging: *default-logging

  prometheus:
    image: ${MINE_PROMETHEUS_IMAGE:-prom/prometheus:v3.12.0}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${MINE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus_data:/prometheus
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../config/prometheus/rules:/etc/prometheus/rules:ro
    depends_on:
      mine-server:
        condition: service_healthy
      mine-gateway:
        condition: service_healthy
      mine-telemetry:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-exporter:
        condition: service_healthy
      timescale-exporter:
        condition: service_healthy
    networks:
      - ingress
      - app
      - data
      - observability
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready | grep -qi ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  loki:
    image: ${MINE_LOKI_IMAGE:-grafana/loki:3.7.2}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "127.0.0.1:${MINE_LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
      - ../config/loki/loki.yml:/etc/loki/loki.yml:ro
    networks:
      - ingress
      - observability
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  alloy:
    image: ${MINE_ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
      - ../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - observability
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging: *default-logging

  grafana:
    image: ${MINE_GRAFANA_IMAGE:-grafana/grafana:13.0.2}
    profiles: ["observability"]
    restart: unless-stopped
    init: true
    read_only: true
    user: "472:472"
    ports:
      - "${MINE_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${MINE_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${MINE_GRAFANA_ADMIN_USER:-mine-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../config/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    networks:
      - ingress
      - observability
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

networks:
  ingress: {}
  app:
    internal: true
  data:
    internal: true
  observability:
    internal: true

volumes:
  rabbitmq_data: {}
  postgres_data: {}
  timescale_data: {}
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  alloy_data: {}

secrets:
  postgres_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/postgres_password
  timescale_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/timescale_password
  timescale_reader_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/timescale_reader_password
  redis_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/redis_password
  rabbitmq_admin_username:
    file: ${MINE_SECRETS_DIR:-../secrets}/rabbitmq_admin_username
  rabbitmq_admin_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/rabbitmq_admin_password
  rabbitmq_gateway_device_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/rabbitmq_gateway_device_password
  rabbitmq_gateway_platform_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/rabbitmq_gateway_platform_password
  rabbitmq_telemetry_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/rabbitmq_telemetry_password
  mine_super_admin_password:
    file: ${MINE_SECRETS_DIR:-../secrets}/mine_super_admin_password
