openapi: 3.1.0
info:
  title: 智慧矿山平台 API
  version: 0.1.0
  description: |
    智慧矿山平台对管理端开放的 REST 契约。本文件固化已实现的产品设备、遥测查询、
    协议黄金样本、配置发布回滚、运行节点证据、设备组和三级有效策略接口。
    所有时间均为带时区的 ISO-8601 UTC 时间。命令中心只开放已发布的低风险命令模板；
    告警中心以触发、恢复、确认和关闭四类正交事实形成可追责处置闭环。
servers:
  - url: /api/v1
security:
  - MineToken: []
tags:
  - name: OperationsDashboard
    description: 调度员和值班人员生产运行总览
  - name: SystemOperations
    description: 系统管理员按需运行状态检查
  - name: SystemConfiguration
    description: 菜单、权限节点和通用字典在线管理
  - name: DeviceRegistry
    description: 产品和设备台账管理
  - name: DeviceModel
    description: 物模型字段和厂商协议映射版本管理
  - name: ProtocolConfiguration
    description: 协议黄金样本、配置发布、节点加载状态与回滚管理
  - name: DeviceStrategy
    description: 设备组、三级策略作用域、冲突预检、发布回滚与有效值追踪
  - name: DeviceTelemetry
    description: 设备最新值与数值遥测历史
  - name: DataGovernance
    description: 数值聚合、数据保留和显式修复的受控运行入口
  - name: CommandCenter
    description: 设备命令下发与可靠状态时间线
  - name: AlarmCenter
    description: 双来源告警查询、确认和恢复后关闭
  - name: NotificationConfiguration
    description: 平台内置通知 Provider 目录和数据库加密渠道配置
  - name: MineScope
    description: 组织、矿区和当前会话数据范围
  - name: MineAssets
    description: 车辆、定位标签、双坐标系和转换版本
  - name: MinePeople
    description: 矿区人员、敏感信息和司机资质
  - name: MineBinding
    description: 车辆、人员、设备和定位标签的原子换绑
  - name: MineLocation
    description: 当前位置快照和有界历史轨迹
  - name: MineSpatial
    description: 途径点、路线和电子围栏的草稿及不可变发布版本
  - name: MineOperation
    description: 班次、运输作业单、调度分配和生产运营生命周期
  - name: MineScene
    description: 三维资源、稳定场景、草稿版本、有序图层和不可变发布
paths:
  /dashboard/operations:
    get:
      tags: [OperationsDashboard]
      operationId: getOperationsDashboard
      summary: 查询矿区调度运行总览
      description: |
        返回启用设备、数据新鲜度、今日接收消息、二十四小时趋势和需要关注的设备。
        遥测库不可用时，dataStatus 为 UNAVAILABLE，相关数字返回 null，不会用零值伪装查询失败。
      responses:
        '200':
          description: 调度运行总览。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /system/operations:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperations
      summary: 按需检查平台运行状态
      description: |
        仅在用户进入运行监控页面或主动刷新时执行，不启动后台轮询。
        需要 system:operations:view 权限，响应不包含连接串、凭据或异常堆栈。
      responses:
        '200':
          description: 平台服务、消息和存储依赖的脱敏状态。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemOperationsOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/operations/overview:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperationsOverview
      summary: 查询平台运行历史总览
      description: |
        通过服务端固定 PromQL 模板查询 Prometheus，不接受调用方传入任意查询表达式。
        Prometheus 未启用或不可用时 dataStatus 为 UNAVAILABLE，各检查项状态为 UNKNOWN。
      parameters:
        - name: range
          in: query
          schema:
            $ref: '#/components/schemas/OperationsObservabilityRange'
      responses:
        '200':
          description: 平台运行历史聚合结论。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsObservabilityOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/operations/items/{key}/check:
    get:
      tags: [SystemOperations]
      operationId: checkSystemOperation
      summary: 独立执行单个运行检查项
      description: |
        供运行监控页面并发调用，单个检查项完成后即可独立展示结果。
        每次调用只执行指定检查项，并受服务端统一超时限制。
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 单个检查项的即时脱敏结果。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemOperationItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/OperationItemNotFound' }
  /system/operations/items/{key}/series:
    get:
      tags: [SystemOperations]
      operationId: getSystemOperationSeries
      summary: 查询单个运行检查项趋势
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
        - name: range
          in: query
          schema:
            $ref: '#/components/schemas/OperationsObservabilityRange'
      responses:
        '200':
          description: 单个检查项的真实状态与延迟采样点。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsObservabilitySeries' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/tree:
    get:
      tags: [SystemConfiguration]
      operationId: getManagedMenuTree
      summary: 查询菜单与按钮权限树
      responses:
        '200':
          description: 完整菜单树，供菜单维护和角色授权复用。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedMenuNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/component-options:
    get:
      tags: [SystemConfiguration]
      operationId: listMenuComponentOptions
      summary: 查询允许配置的前端页面组件
      responses:
        '200':
          description: 编译期注册的页面组件白名单。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuComponentOption' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/{menuId}/buttons:
    get:
      tags: [SystemConfiguration]
      operationId: listManagedMenuButtons
      summary: 按需查询页面的按钮权限
      parameters:
        - name: menuId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 页面的直接按钮权限节点。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedMenuNode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /system/menus/batch-delete:
    post:
      tags: [SystemConfiguration]
      operationId: batchDeleteManagedMenus
      summary: 原子批量删除菜单节点
      description: |
        整批校验核心节点、角色引用和子节点约束；任一节点不允许删除时不执行任何删除。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuBatchDeleteRequest' }
      responses:
        '204': { description: 选中的菜单节点已删除。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/menus:
    get:
      tags: [SystemConfiguration]
      operationId: listManagedMenus
      summary: 按父节点分页查询菜单树表格
      description: |
        不传 parentId 时查询根目录；展开目录时传入该目录标识，只返回直接子目录和页面。
        筛选条件命中后会保留命中节点的祖先链，便于仍按树层级展开。
      parameters:
        - name: parentId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Keyword'
        - name: type
          in: query
          schema: { type: string, enum: [DIRECTORY, MENU] }
        - name: status
          in: query
          schema: { type: string, enum: [ENABLED, DISABLED] }
        - $ref: '#/components/parameters/Page'
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: 当前父节点下的菜单节点分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createManagedMenu
      summary: 创建目录、页面或按钮权限节点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuSaveRequest' }
      responses:
        '201':
          description: 菜单节点已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/menus/{menuId}:
    parameters:
      - name: menuId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateManagedMenu
      summary: 修改菜单节点
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuSaveRequest' }
      responses:
        '200':
          description: 修改后的菜单节点。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedMenuNode' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteManagedMenu
      summary: 删除未被引用的非保护菜单节点
      responses:
        '204': { description: 菜单节点已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries:
    get:
      tags: [SystemConfiguration]
      operationId: listDictionaryTypes
      summary: 查询全部通用字典类型
      responses:
        '200':
          description: 字典类型列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createDictionaryType
      summary: 创建通用字典类型
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryTypeCreateRequest' }
      responses:
        '200':
          description: 字典类型已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/{dictionaryTypeId}:
    parameters:
      - name: dictionaryTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateDictionaryType
      summary: 修改字典类型的可变信息
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryTypeUpdateRequest' }
      responses:
        '200':
          description: 修改后的字典类型。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteDictionaryType
      summary: 删除空的非内置字典类型
      responses:
        '204': { description: 字典类型已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/{dictionaryTypeId}/items:
    parameters:
      - name: dictionaryTypeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [SystemConfiguration]
      operationId: listDictionaryItems
      summary: 查询字典类型下的全部数据项
      responses:
        '200':
          description: 字典数据项列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [SystemConfiguration]
      operationId: createDictionaryItem
      summary: 创建字典数据项
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryItemCreateRequest' }
      responses:
        '200':
          description: 字典数据项已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /system/dictionaries/items/{dictionaryItemId}:
    parameters:
      - name: dictionaryItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [SystemConfiguration]
      operationId: updateDictionaryItem
      summary: 修改字典数据项的可变信息
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictionaryItemUpdateRequest' }
      responses:
        '200':
          description: 修改后的字典数据项。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DictionaryItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [SystemConfiguration]
      operationId: deleteDictionaryItem
      summary: 删除字典数据项
      responses:
        '204': { description: 字典数据项已删除。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /dictionaries/{dictionaryCode}/items:
    get:
      tags: [SystemConfiguration]
      operationId: listEnabledDictionaryItems
      summary: 按稳定编码查询启用字典项
      parameters:
        - name: dictionaryCode
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
      responses:
        '200':
          description: 可供业务页面使用的启用字典项。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DictionaryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /device-models/products/{productId}/configuration:
    get:
      tags: [DeviceModel]
      operationId: getProductDeviceConfiguration
      summary: 查询产品的物模型与协议映射版本
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 产品全部物模型和协议映射版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDeviceConfiguration' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
  /device-models/products/{productId}/model-drafts:
    post:
      tags: [DeviceModel]
      operationId: createDeviceModelDraft
      summary: 创建空物模型草稿版本
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DescriptionRequest' }
      responses:
        '200':
          description: 新建的物模型草稿版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceModelVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
  /device-models/model-versions/{modelVersionId}/fields:
    put:
      tags: [DeviceModel]
      operationId: replaceDeviceModelFields
      summary: 原子替换物模型草稿的全部字段
      parameters:
        - name: modelVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceModelFieldsRequest' }
      responses:
        '200':
          description: 保存后的物模型字段。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceModelField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/model-versions/{modelVersionId}/publish:
    post:
      tags: [DeviceModel]
      operationId: publishDeviceModelVersion
      summary: 发布物模型草稿并退役旧发布版本
      parameters:
        - name: modelVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionRequest' }
      responses:
        '204': { description: 物模型版本已发布。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/products/{productId}/protocol-drafts:
    post:
      tags: [DeviceModel]
      operationId: createProtocolMappingDraft
      summary: 创建厂商协议字段映射草稿
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolMappingDraftRequest' }
      responses:
        '200':
          description: 新建的协议映射草稿版本。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProtocolMappingVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /device-models/protocol-versions/{protocolVersionId}/fields:
    put:
      tags: [DeviceModel]
      operationId: replaceProtocolMappingFields
      summary: 原子替换协议草稿的全部字段映射
      parameters:
        - name: protocolVersionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolMappingFieldsRequest' }
      responses:
        '200':
          description: 保存后的协议字段映射。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProtocolMappingField' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-models/protocol-versions/{protocolVersionId}/publish:
    post:
      tags: [DeviceModel]
      operationId: publishProtocolMappingVersion
