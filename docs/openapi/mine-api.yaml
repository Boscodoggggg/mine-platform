      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 按数据库开始时间倒序排列的最近执行事实。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RetentionExecution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/RetentionRuntimeUnavailable' }
  /aggregation-recomputations:
    post:
      tags: [DataGovernance]
      operationId: createAggregationRecomputation
      summary: 登记有界且幂等的显式聚合重算请求
      description: |
        需要 `governance:aggregation:execute` 权限。目标必须匹配当前启用的精确聚合规则；时间范围按 UTC
        桶边界对齐，最长 31 天且最多 10000 个桶。接口只写入不可覆盖的 PENDING 控制面事实并返回 202，
        不在 HTTP 请求线程内执行重算。相同操作人和幂等键只能重放完全相同的请求。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AggregationRecomputeRequest' }
      responses:
        '202':
          description: 重算请求已接受或完成幂等重放。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AggregationRecompute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/TelemetryBusy' }
    get:
      tags: [DataGovernance]
      operationId: listAggregationRecomputations
      summary: 查询最近显式聚合重算请求
      description: 需要 `governance:aggregation:view` 权限，返回业务控制面中的请求生命周期事实。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 按创建时间倒序排列的重算请求。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AggregationRecompute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
