      type: object
      required: [required, preview]
      properties:
        required:
          type: boolean
          description: true 表示设备组变化必须在同一事务消费 preview 中的凭证。
        preview:
          oneOf:
            - $ref: '#/components/schemas/RetentionPreview'
            - type: 'null'
