      properties:
        connectionMode: { $ref: '#/components/schemas/DeviceConnectionMode' }
        host: { type: string, minLength: 1, maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.:-]{0,251}[A-Za-z0-9])?$' }
        port: { type: integer, minimum: 1, maximum: 65535 }
        tlsEnabled: { type: boolean }
        tlsServerName: { type: [string, 'null'], maxLength: 253, pattern: '^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$' }
        connectTimeoutMillis: { type: integer, minimum: 250, maximum: 30000 }
        keepAliveSeconds: { type: integer, minimum: 0, maximum: 86400 }
        offlineThresholdSeconds: { type: integer, minimum: 1, maximum: 604800 }
        version: { type: integer, format: int64, minimum: 0 }
    DeviceConnectionTestResult:
      type: object
      required: [deviceId, status, startedAt, durationMillis, message, stages]
      properties:
        deviceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/DeviceConnectionTestStatus' }
        startedAt: { type: string, format: date-time }
        durationMillis: { type: integer, format: int64, minimum: 0 }
        message:
          type: string
          maxLength: 500
          description: 稳定诊断结论码，由客户端国际化展示
        stages:
          type: array
          items: { $ref: '#/components/schemas/DeviceConnectionTestStage' }
    DeviceUpdateRequest:
      type: object
      required: [name, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ENABLED, DISABLED] }
        version: { type: integer, format: int64, minimum: 0 }
    ArchiveRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    PageMetadata:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PropertyId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
    TelemetryQuality:
      type: string
      enum: [GOOD, UNCERTAIN, BAD, TIME_UNTRUSTED]
    DeviceLatest:
      type: object
      required: [deviceId, items, missingPropertyIds]
      properties:
        deviceId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLatestItem'
        missingPropertyIds:
          type: array
          items:
            $ref: '#/components/schemas/PropertyId'
    TelemetryLatestItem:
      type: object
      required: [propertyId, value, occurredAt, receivedAt, quality, eventId, source]
      properties:
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        value:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: string
          format: uuid
        bootId:
          type: [string, 'null']
        sequence:
          type: [integer, 'null']
          format: int64
        source:
          type: string
          enum: [REDIS, TIMESCALEDB]
    TelemetryHistory:
      type: object
      required: [deviceId, propertyId, aggregation, watermark, items, page, size, total]
      properties:
        deviceId:
          type: string
          format: uuid
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        aggregation:
          type: string
          enum: [RAW, AVG, MIN, MAX]
        bucket:
          type: [string, 'null']
          format: duration
        watermark:
          type: integer
          format: int64
          minimum: 0
          description: 本次分页数据集固定使用的数据库摄取水位上限。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryHistoryPoint'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 1000
        total:
          type: integer
          format: int64
          minimum: 0
    TelemetryHistoryPoint:
      type: object
      required: [occurredAt, receivedAt, value, quality, sampleCount]
      properties:
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        value:
          type: number
          format: double
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: [string, 'null']
          format: uuid
        sampleCount:
          type: integer
          format: int64
          minimum: 1
    ApiError:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: 参数、属性标识、时间范围或聚合参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 登录状态无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 缺少当前操作要求的权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    OperationItemNotFound:
      description: 运行检查项不存在，错误码 SYSTEM-404-006。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: 设备不存在，错误码 DEVICE-404-002。
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    CommandNotFound:
      description: 命令不存在，错误码 COMMAND-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProductNotFound:
      description: 产品不存在，错误码 DEVICE-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 编码重复、状态冲突或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 命令模板、目标设备、参数或时间约束不允许下发。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TelemetryBusy:
      description: 等待同一属性的共享回源超过 2 秒或时序库查询超时，错误码 TELEMETRY-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
