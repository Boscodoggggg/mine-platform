spring:
  application:
    name: mine-telemetry
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MINE_TELEMETRY_HTTP_PORT:8082}
  shutdown: graceful

management:
  health:
    rabbit:
      enabled: ${MINE_TELEMETRY_RABBIT_ENABLED:false}
  server:
    port: ${MINE_TELEMETRY_MANAGEMENT_PORT:18082}
    address: ${MINE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 矿山遥测处理服务
    version: ${MINE_APP_VERSION:0.1.0-SNAPSHOT}

mine:
  telemetry:
    rabbit:
      enabled: ${MINE_TELEMETRY_RABBIT_ENABLED:false}
      auto-startup: ${MINE_TELEMETRY_RABBIT_AUTO_STARTUP:true}
      host: ${MINE_TELEMETRY_RABBIT_HOST:rabbitmq}
      port: ${MINE_TELEMETRY_RABBIT_PORT:5672}
      prefetch: ${MINE_TELEMETRY_RABBIT_PREFETCH:200}
      batch-size: ${MINE_TELEMETRY_RABBIT_BATCH_SIZE:100}
      receive-timeout-millis: ${MINE_TELEMETRY_RABBIT_RECEIVE_TIMEOUT_MILLIS:1000}
      confirm-timeout-millis: ${MINE_TELEMETRY_RABBIT_CONFIRM_TIMEOUT_MILLIS:5000}
      account:
        username: ${MINE_TELEMETRY_RABBIT_USERNAME:mine-telemetry}
        password-file: ${MINE_TELEMETRY_RABBIT_PASSWORD_FILE:/run/secrets/rabbitmq_telemetry_password}
      outbox:
        instance-id: ${MINE_TELEMETRY_INSTANCE_ID:${HOSTNAME:mine-telemetry}}
        lease-duration: ${MINE_TELEMETRY_OUTBOX_LEASE_DURATION:30s}
        max-attempts: ${MINE_TELEMETRY_OUTBOX_MAX_ATTEMPTS:8}
        recovery-limit: ${MINE_TELEMETRY_OUTBOX_RECOVERY_LIMIT:500}
        retry-base-delay: ${MINE_TELEMETRY_OUTBOX_RETRY_BASE_DELAY:1s}
        retry-max-delay: ${MINE_TELEMETRY_OUTBOX_RETRY_MAX_DELAY:5m}
        dispatch-concurrency: ${MINE_TELEMETRY_OUTBOX_DISPATCH_CONCURRENCY:4}
        dispatch-queue-capacity: ${MINE_TELEMETRY_OUTBOX_DISPATCH_QUEUE_CAPACITY:1000}
        recovery-interval: ${MINE_TELEMETRY_OUTBOX_RECOVERY_INTERVAL:10s}
    strategy-distribution:
      enabled: ${MINE_TELEMETRY_STRATEGY_DISTRIBUTION_ENABLED:false}
      server-url: ${MINE_TELEMETRY_STRATEGY_SERVER_URL:http://mine-server:8080}
      service-token-file: ${MINE_CONFIGURATION_DISTRIBUTION_TOKEN_FILE:/run/secrets/mine_configuration_distribution_token}
      page-size: ${MINE_TELEMETRY_STRATEGY_PAGE_SIZE:500}
      request-timeout: ${MINE_TELEMETRY_STRATEGY_REQUEST_TIMEOUT:10s}
