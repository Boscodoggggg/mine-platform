        '404': { $ref: '#/components/responses/DeviceNotFound' }
  /devices/{deviceId}/latest:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceLatestTelemetry
      summary: 查询设备指定属性的最新值
      description: |
        需要 `device:telemetry:view` 权限。优先读取 Redis；缓存缺失时按设备和属性键合并并发请求，
        从 TimescaleDB 回源最近历史并使用 HSETNX 回填，避免旧历史覆盖并发到达的新数据。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyIds
          in: query
          required: true
          description: 传入数量为 1 至 100；服务去重后按首次出现顺序返回。
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/PropertyId'
      responses:
        '200':
          description: 最新值快照；没有历史的属性出现在 missingPropertyIds。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLatest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /devices/{deviceId}/telemetry:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceTelemetryHistory
      summary: 分页查询设备单个数值属性历史
      description: |
        需要 `device:telemetry:view` 权限。时间范围采用 `[from, to)`；RAW 最多查询 7 天且不能传 bucket；
        AVG、MIN、MAX 最多查询 366 天，bucket 必须在 1 分钟至 24 小时之间且最多产生 10000 个桶。
        bucket 只接受整秒精度。聚合结果的 quality 取桶内最差质量，sampleCount 表示桶内样本数；
        分页 offset 不得超过 1000000。首页可省略 watermark，响应会返回数据库已提交事件的摄取水位；
        后续页必须原样传回，以排除 RabbitMQ 积压、数据库重试和弱网迟到点在翻页期间造成的重复或遗漏。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PropertyId'
        - name: from
          in: query
          required: true
          description: 开始时间，包含。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间，不包含。
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [RAW, AVG, MIN, MAX]
            default: RAW
        - name: bucket
          in: query
          description: 聚合时间桶，使用 ISO-8601 Duration，例如 PT5M；RAW 查询不能传入。
          schema:
            type: string
            format: duration
        - name: watermark
          in: query
          description: 分页数据集的全局摄取水位上限；首页省略，后续页传回首页响应中的 watermark，不得大于服务端当前已提交水位。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 原始遥测点或聚合时间桶分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /device-groups:
    get:
      tags: [DeviceStrategy]
      operationId: listDeviceGroups
      summary: 分页查询产品内设备组
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeviceGroupStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 设备组分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroupPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceStrategy]
      operationId: createDeviceGroup
      summary: 创建设备组
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupCreateRequest' }
      responses:
        '201':
          description: 设备组已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/DeviceGroupId'
    get:
      tags: [DeviceStrategy]
      operationId: getDeviceGroup
      summary: 查询设备组详情
      responses:
        '200':
          description: 设备组详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
    put:
      tags: [DeviceStrategy]
      operationId: updateDeviceGroup
      summary: 修改设备组和策略优先级
      description: 优先级变化会对当前成员执行策略冲突预检；若设备组已有 RETENTION 发布，还必须提交拟变更影响预览凭证。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupUpdateRequest' }
      responses:
        '200':
          description: 修改后的设备组。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-groups/{groupId}/members:
    parameters:
      - $ref: '#/components/parameters/DeviceGroupId'
    get:
      tags: [DeviceStrategy]
      operationId: listDeviceGroupMembers
      summary: 查询设备组当前成员
      responses:
        '200':
          description: 当前成员列表。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeviceGroupMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
    put:
      tags: [DeviceStrategy]
      operationId: replaceDeviceGroupMembers
      summary: 差异化替换设备组当前成员
      description: 新增成员前执行策略冲突预检；若设备组已有 RETENTION 发布，还必须提交拟变更影响预览凭证。历史成员关系以生效区间保留。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupMembersRequest' }
      responses:
        '200':
          description: 成员差异摘要。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceGroupMembershipChange' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /device-groups/{groupId}/archive:
    post:
      tags: [DeviceStrategy]
      operationId: archiveDeviceGroup
      summary: 归档设备组并结束当前成员关系
      description: 若设备组已有 RETENTION 发布，必须提交归档后的逐设备影响预览凭证。
      parameters:
        - $ref: '#/components/parameters/DeviceGroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceGroupArchiveRequest' }
      responses:
        '204': { description: 设备组已归档。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /strategy-versions:
    get:
      tags: [DeviceStrategy]
      operationId: listStrategyVersions
      summary: 查询策略版本
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: strategyType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StrategyType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StrategyVersionStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 最近的策略版本。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StrategyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceStrategy]
      operationId: createStrategyDraft
      summary: 创建白名单类型策略草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyDraftCreateRequest' }
      responses:
        '201':
          description: 策略草稿已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /strategy-versions/{strategyVersionId}:
    parameters:
      - $ref: '#/components/parameters/StrategyVersionId'
    get:
      tags: [DeviceStrategy]
      operationId: getStrategyVersion
      summary: 查询单个策略版本
      responses:
        '200':
          description: 策略版本详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
    put:
      tags: [DeviceStrategy]
      operationId: updateStrategyDraft
      summary: 使用乐观锁修改策略草稿
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyDraftUpdateRequest' }
      responses:
        '200':
          description: 修改后的策略草稿。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /strategy-releases:
    get:
      tags: [DeviceStrategy]
      operationId: listStrategyReleases
      summary: 查询不可变策略发布历史
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: strategyType
          in: query
          required: true
          schema: { $ref: '#/components/schemas/StrategyType' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: 最近的策略发布历史。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StrategyRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceStrategy]
      operationId: publishStrategy
      summary: 冲突预检通过后原子发布策略
      description: |
        计算所有受影响设备的三级有效策略。同优先级设备组对同一字段给出不同值时，
        返回 STRATEGY-409-001，策略版本、发布事实和审计均不提交。RETENTION 还必须携带
        服务端签发且绑定已保存版本、作用域、成员和最终解析状态的一次性预览凭证。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyPublishRequest' }
      responses:
        '201':
          description: 不可变策略发布已创建。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /strategy-releases/{strategyReleaseId}:
    get:
      tags: [DeviceStrategy]
      operationId: getStrategyRelease
      summary: 查询单个不可变策略发布
      parameters:
        - $ref: '#/components/parameters/StrategyReleaseId'
      responses:
        '200':
          description: 策略发布详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyRelease' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
  /strategy-releases/{strategyReleaseId}/rollback:
    post:
      tags: [DeviceStrategy]
      operationId: rollbackStrategyRelease
      summary: 复用历史版本创建更高序号的回滚发布
      description: RETENTION 回滚必须重新预览历史发布的版本和作用域并提交新的一次性凭证。
      parameters:
        - $ref: '#/components/parameters/StrategyReleaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StrategyRollbackRequest' }
      responses:
        '201':
          description: 回滚发布已创建，历史记录未被修改。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /retention-previews:
    post:
      tags: [DeviceStrategy]
      operationId: previewRetentionImpact
      summary: 预览拟发布数据保留策略的不可逆影响
      description: |
        读取已保存策略版本，按产品、设备组和单设备覆盖关系计算发布后的逐设备最终策略，
        再使用 TimescaleDB 只读连接统计原始数值遥测与质量证据的删除候选。统计达到一百万行
        时返回封顶值并将 atLeast 置为 true。若所有最终策略均禁用，则不依赖 TimescaleDB 即可
        签发停删凭证。预览是数据库时点估算而非上下限或删除承诺。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionPreviewRequest' }
      responses:
        '200':
          description: 带统计时点、最终覆盖摘要和十五分钟一次性凭证的影响预览。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/RetentionRuntimeUnavailable' }
  /retention-group-change-previews:
    post:
      tags: [DeviceStrategy]
      operationId: previewRetentionGroupChange
      summary: 预览设备组变化间接激活数据保留策略的不可逆影响
      description: |
        根据成员替换、优先级修改或设备组归档的拟变更，在不落库的情况下重新解析每台受影响设备的
        最终 RETENTION 策略。仅当设备组存在当前 RETENTION 发布且有受影响设备时签发十五分钟一次性凭证；
        预览要求同时具备设备组编辑和策略发布权限。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetentionGroupChangePreviewRequest' }
      responses:
        '200':
          description: 是否需要不可逆激活凭证，以及需要时的删除影响。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetentionGroupChangePreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/RetentionRuntimeUnavailable' }
  /retention-executions:
    get:
      tags: [DeviceStrategy]
      operationId: listRetentionExecutions
      summary: 查询最近数据保留执行事实
      description: 直接读取 Telemetry 不可删除的执行事实，不向业务数据库复制运行状态。
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 按数据库开始时间倒序排列的最近执行事实。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RetentionExecution' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/RetentionRuntimeUnavailable' }
  /devices/{deviceId}/effective-strategies/{strategyType}:
    get:
      tags: [DeviceStrategy]
      operationId: getEffectiveDeviceStrategy
      summary: 查询设备当前有效策略和逐字段来源
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: strategyType
          in: path
          required: true
          schema: { $ref: '#/components/schemas/StrategyType' }
      responses:
        '200':
          description: 按产品默认、设备组优先级和单设备覆盖计算的有效值。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveStrategy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/StrategyNotFound' }
components:
  securitySchemes:
    MineToken:
      type: apiKey
      in: header
      name: X-Mine-Token
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 设备 UUID。
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      description: 命令 UUID。
      schema:
        type: string
        format: uuid
    AlarmId:
      name: alarmId
      in: path
      required: true
      description: 告警周期 UUID。
      schema:
        type: string
        format: uuid
    ProtocolVersionId:
      name: protocolVersionId
      in: path
      required: true
      description: 协议映射版本 UUID。
      schema: { type: string, format: uuid }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: 配置发布 UUID。
      schema: { type: string, format: uuid }
    DeviceGroupId:
      name: groupId
      in: path
      required: true
      description: 设备组 UUID。
      schema: { type: string, format: uuid }
    StrategyVersionId:
      name: strategyVersionId
      in: path
      required: true
      description: 策略版本 UUID。
      schema: { type: string, format: uuid }
    StrategyReleaseId:
      name: strategyReleaseId
      in: path
      required: true
      description: 不可变策略发布 UUID。
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一业务操作重试时保持不变的稳定幂等键。
      schema: { type: string, minLength: 1, maxLength: 128 }
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    DeviceGroupStatus:
      type: string
      enum: [ACTIVE, ARCHIVED]
    DeviceGroup:
      type: object
      required:
        - id
        - productId
        - groupKey
        - name
        - priority
        - status
        - createdAt
        - updatedAt
        - version
        - memberCount
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        groupKey:
          type: string
          pattern: '^[a-z][a-z0-9-]{2,63}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: 数值越大优先级越高；同级同字段异值会触发冲突门禁。
        status: { $ref: '#/components/schemas/DeviceGroupStatus' }
        description: { type: [string, 'null'], maxLength: 500 }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        memberCount: { type: integer, format: int64, minimum: 0 }
    DeviceGroupPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeviceGroup' }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    DeviceGroupCreateRequest:
      type: object
      additionalProperties: false
      required: [productId, groupKey, name, priority]
      properties:
        productId: { type: string, format: uuid }
        groupKey:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9-]{2,63}$'
        name: { type: string, minLength: 1, maxLength: 128 }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        description: { type: [string, 'null'], maxLength: 500 }
    DeviceGroupUpdateRequest:
      type: object
      additionalProperties: false
      required: [name, priority, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        priority: { type: integer, minimum: 0, maximum: 1000 }
        description: { type: [string, 'null'], maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
        retentionPreviewToken:
          type: string
          format: uuid
          description: 当前设备组已有 RETENTION 发布且优先级变化时必填。
    DeviceGroupMember:
      type: object
      required: [id, deviceCode, name, status, effectiveFrom]
      properties:
        id: { type: string, format: uuid }
        deviceCode: { type: string }
        name: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED] }
        effectiveFrom: { type: string, format: date-time }
    DeviceGroupMembersRequest:
      type: object
      additionalProperties: false
      required: [deviceIds, version]
      properties:
        deviceIds:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { type: string, format: uuid }
        version: { type: integer, format: int64, minimum: 0 }
        retentionPreviewToken:
          type: string
          format: uuid
          description: 当前设备组已有 RETENTION 发布且成员变化时必填。
    DeviceGroupArchiveRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        retentionPreviewToken:
          type: string
          format: uuid
          description: 当前设备组已有 RETENTION 发布且仍有成员时必填。
    DeviceGroupMembershipChange:
      type: object
      required: [groupId, addedDeviceIds, removedDeviceIds, memberCount, version]
      properties:
        groupId: { type: string, format: uuid }
        addedDeviceIds:
          type: array
          items: { type: string, format: uuid }
        removedDeviceIds:
          type: array
          items: { type: string, format: uuid }
        memberCount: { type: integer, minimum: 0 }
        version: { type: integer, format: int64, minimum: 0 }
    StrategyType:
      type: string
      enum: [ONLINE_STATUS, DATA_QUALITY, ALARM, RETENTION, AGGREGATION]
    StrategyScopeType:
      type: string
      enum: [PRODUCT, GROUP, DEVICE]
    StrategyVersionStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    OnlineStatusStrategyValues:
      type: object
      additionalProperties: false
      required: [offlineThresholdSeconds]
      properties:
        offlineThresholdSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          description: 无有效上行活动后判定设备离线的秒数。
    DataQualityStrategyValues:
      type: object
      minProperties: 1
      maxProperties: 256
      additionalProperties: false
      properties:
        staleAfterSeconds:
          type: integer
          minimum: 1
          maximum: 604800
          description: 设备发生时间早于平台接收时间超过该秒数时标记为不确定。
        futureToleranceSeconds:
          type: integer
          minimum: 0
          maximum: 3600
          description: 设备发生时间允许超前平台接收时间的最大秒数。
      patternProperties:
        '^required\.[A-Za-z][A-Za-z0-9_.-]{0,127}$':
          type: boolean
          description: 指定物模型属性是否为本帧必填项。
        '^minimum\.[A-Za-z][A-Za-z0-9_.-]{0,127}$':
          type: number
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: 指定数值属性的质量下限。
        '^maximum\.[A-Za-z][A-Za-z0-9_.-]{0,127}$':
          type: number
          minimum: -1000000000000000
          maximum: 1000000000000000
          description: 指定数值属性的质量上限。
    AlarmNumericRule:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - sourceType
        - severity
        - triggerDurationSeconds
        - recoverDurationSeconds
        - cooldownSeconds
        - propertyId
        - operator
        - threshold
        - recoverThreshold
      properties:
        key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        sourceType: { type: string, enum: [NUMERIC] }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        triggerDurationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        recoverDurationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        cooldownSeconds: { type: integer, minimum: 0, maximum: 604800 }
        enabled: { type: boolean, default: true }
        propertyId:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
        operator: { type: string, enum: [GT, GTE, LT, LTE] }
        threshold:
          type: number
          minimum: -1000000000000000
          maximum: 1000000000000000
          multipleOf: 0.000000000001
          description: 绝对值不超过 10^15，最多 12 位小数。
        recoverThreshold:
          type: number
          minimum: -1000000000000000
          maximum: 1000000000000000
          multipleOf: 0.000000000001
          description: 绝对值不超过 10^15，最多 12 位小数。
    AlarmQualityRule:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - sourceType
        - severity
        - triggerDurationSeconds
        - recoverDurationSeconds
        - cooldownSeconds
        - qualityRuleCode
      properties:
        key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        name: { type: string, minLength: 1, maxLength: 100 }
        sourceType: { type: string, enum: [QUALITY] }
        severity: { type: string, enum: [INFO, WARNING, CRITICAL] }
        triggerDurationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        recoverDurationSeconds: { type: integer, minimum: 0, maximum: 86400 }
        cooldownSeconds: { type: integer, minimum: 0, maximum: 604800 }
        enabled: { type: boolean, default: true }
        propertyId:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
        qualityRuleCode:
          type: string
          enum:
            - FUTURE_TIMESTAMP
            - STALE_TIMESTAMP
            - REQUIRED_MISSING
            - BELOW_MINIMUM
            - ABOVE_MAXIMUM
    AlarmStrategyValues:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/AlarmNumericRule'
              - $ref: '#/components/schemas/AlarmQualityRule'
    RetentionClass:
      type: string
      enum: [SHORT, STANDARD, LONG, ARCHIVE]
    RetentionPolicy:
      type: object
      additionalProperties: false
      required: [enabled, retentionClass, rawTelemetryDays, qualityEvidenceDays]
      properties:
        enabled:
          type: boolean
          description: false 时安全暂停后续删除，但不会恢复已经删除的数据。
        retentionClass: { $ref: '#/components/schemas/RetentionClass' }
        rawTelemetryDays:
          type: integer
          minimum: 7
          maximum: 3650
          description: 还必须符合所选保留等级的天数区间。
        qualityEvidenceDays:
          type: integer
          minimum: 7
          maximum: 3650
          description: 不得短于原始数值遥测保留天数。
    RetentionStrategyValues:
      type: object
      additionalProperties: false
      required: [policy]
      properties:
        policy: { $ref: '#/components/schemas/RetentionPolicy' }
    StrategyValues:
      oneOf:
        - $ref: '#/components/schemas/OnlineStatusStrategyValues'
        - $ref: '#/components/schemas/DataQualityStrategyValues'
        - $ref: '#/components/schemas/AlarmStrategyValues'
        - $ref: '#/components/schemas/RetentionStrategyValues'
    RetentionPreviewRequest:
      type: object
      additionalProperties: false
      required: [productId, strategyVersionId, scopeType, scopeId]
      properties:
        productId: { type: string, format: uuid }
        strategyVersionId:
          type: string
          format: uuid
          description: 必须是同产品下已经保存的 RETENTION 草稿或历史不可变版本。
        scopeType: { $ref: '#/components/schemas/StrategyScopeType' }
        scopeId:
          type: string
          format: uuid
          description: 必须是同产品的活动产品、活动设备组或未归档设备。
    RetentionGroupChangeType:
      type: string
      enum: [MEMBERSHIP, PRIORITY, GROUP_ARCHIVE]
    RetentionGroupChangePreviewRequest:
      type: object
      additionalProperties: false
      required: [groupId, changeType, groupVersion]
      properties:
        groupId: { type: string, format: uuid }
        changeType: { $ref: '#/components/schemas/RetentionGroupChangeType' }
        groupVersion: { type: integer, format: int64, minimum: 0 }
        deviceIds:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { type: string, format: uuid }
          description: MEMBERSHIP 时为变化后的完整成员集合。
        nextPriority:
          type: integer
          minimum: 0
          maximum: 1000
          description: PRIORITY 时为变化后的优先级。
    RetentionGroupChangePreview:
      type: object
      required: [required, preview]
      properties:
        required:
          type: boolean
          description: true 表示设备组变化必须在同一事务消费 preview 中的凭证。
        preview:
          oneOf:
            - $ref: '#/components/schemas/RetentionPreview'
            - type: 'null'
    RetentionDatasetImpact:
      type: object
      required: [eligibleRows, atLeast]
      properties:
        eligibleRows:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: 达到删除年龄的候选行数，可能是统计上限。
        earliestEligibleAt:
          type: [string, 'null']
          format: date-time
        atLeast:
          type: boolean
          description: true 表示实际候选数量大于 eligibleRows。
    RetentionPreview:
      type: object
      required:
        - previewToken
        - observedAt
        - expiresAt
        - targetDeviceCount
        - affectedDeviceCount
        - enabledDeviceCount
        - policy
        - rawTelemetry
        - qualityEvidence
      properties:
        previewToken:
          type: string
          format: uuid
          description: 仅能由同一管理员用于一次精确匹配的发布或回滚。
        observedAt:
          type: string
          format: date-time
          description: TimescaleDB 统计时点；纯停删预览为服务端生成时点。
        expiresAt: { type: string, format: date-time }
        targetDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 作用域内参与最终策略解析的设备数。
        affectedDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 发布后最终保留策略值发生变化的设备数。
        enabledDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 发布后最终策略仍启用删除的设备数，包含更具体作用域覆盖。
        policy: { $ref: '#/components/schemas/RetentionPolicy' }
        rawTelemetry: { $ref: '#/components/schemas/RetentionDatasetImpact' }
        qualityEvidence: { $ref: '#/components/schemas/RetentionDatasetImpact' }
    RetentionExecutionStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, PARTIAL, FAILED]
    RetentionExecution:
      type: object
      required:
        - executionId
        - instanceId
        - status
        - policyCount
        - rawRowsDeleted
        - qualityRowsDeleted
        - batchCount
        - startedAt
      properties:
        executionId: { type: string, format: uuid }
        instanceId: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/RetentionExecutionStatus' }
        policyCount: { type: integer, minimum: 0 }
        rawRowsDeleted: { type: integer, format: int64, minimum: 0 }
        qualityRowsDeleted: { type: integer, format: int64, minimum: 0 }
        batchCount: { type: integer, minimum: 0 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        lastError:
          type: [string, 'null']
          maxLength: 2000
          description: Telemetry 写入的脱敏截断失败摘要。
    StrategyVersion:
      type: object
      required:
        - id
        - productId
        - strategyType
        - versionNumber
        - status
        - values
        - createdAt
        - updatedAt
        - version
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        strategyType: { $ref: '#/components/schemas/StrategyType' }
        versionNumber: { type: integer, format: int64, minimum: 1 }
        status: { $ref: '#/components/schemas/StrategyVersionStatus' }
        values: { $ref: '#/components/schemas/StrategyValues' }
        contentHash:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
        description: { type: [string, 'null'], maxLength: 500 }
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    StrategyDraftCreateRequest:
      type: object
      additionalProperties: false
      required: [productId, strategyType, values]
      properties:
        productId: { type: string, format: uuid }
        strategyType: { $ref: '#/components/schemas/StrategyType' }
        values: { $ref: '#/components/schemas/StrategyValues' }
        description: { type: [string, 'null'], maxLength: 500 }
    StrategyDraftUpdateRequest:
      type: object
      additionalProperties: false
      required: [values, version]
      properties:
        values: { $ref: '#/components/schemas/StrategyValues' }
        description: { type: [string, 'null'], maxLength: 500 }
        version: { type: integer, format: int64, minimum: 0 }
    StrategyPublishRequest:
      type: object
      additionalProperties: false
      required: [strategyVersionId, scopeType, scopeId, reason]
      properties:
        strategyVersionId: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/StrategyScopeType' }
        scopeId:
          type: string
          format: uuid
          description: 产品、设备组或设备标识，必须与策略版本所属产品兼容。
        reason: { type: string, minLength: 1, maxLength: 500 }
        retentionPreviewToken:
          type: [string, 'null']
          format: uuid
          description: RETENTION 发布必填；其他策略忽略。
    StrategyRollbackRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        retentionPreviewToken:
          type: [string, 'null']
          format: uuid
          description: RETENTION 回滚必填，且必须针对历史版本与原作用域重新签发。
    StrategyRelease:
      type: object
      required:
        - id
        - productId
        - strategyVersionId
        - strategyType
        - releaseSequence
        - scopeType
        - scopeId
        - action
        - contentHash
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        strategyVersionId: { type: string, format: uuid }
        strategyType: { $ref: '#/components/schemas/StrategyType' }
        releaseSequence: { type: integer, format: int64, minimum: 1 }
        scopeType: { $ref: '#/components/schemas/StrategyScopeType' }
        scopeId: { type: string, format: uuid }
        groupPriority:
          type: [integer, 'null']
          minimum: 0
          maximum: 1000
          description: 发布时的设备组优先级审计快照，非设备组范围为空。
        action: { type: string, enum: [PUBLISH, ROLLBACK] }
        rollbackOfReleaseId: { type: [string, 'null'], format: uuid }
        contentHash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
    StrategyValueSource:
      type: object
      required: [scopeType, scopeId, releaseId]
      properties:
        scopeType: { $ref: '#/components/schemas/StrategyScopeType' }
        scopeId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        groupPriority: { type: [integer, 'null'], minimum: 0, maximum: 1000 }
    StrategyConflict:
      type: object
      required: [field, groupPriority, groupIds]
      properties:
        field: { type: string }
        groupPriority: { type: integer, minimum: 0, maximum: 1000 }
        groupIds:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
    EffectiveStrategy:
      type: object
      required: [deviceId, productId, strategyType, valid, values, sources, conflicts]
      properties:
        deviceId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        strategyType: { $ref: '#/components/schemas/StrategyType' }
        valid: { type: boolean }
        values:
          oneOf:
            - $ref: '#/components/schemas/StrategyValues'
            - type: object
              additionalProperties: false
              maxProperties: 0
              description: 最终策略冲突或没有可用发布时返回空对象。
        sources:
          type: object
          additionalProperties: { $ref: '#/components/schemas/StrategyValueSource' }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/StrategyConflict' }
        contentHash:
          type: [string, 'null']
          pattern: '^sha256:[0-9a-f]{64}$'
    SystemOperationStatus:
      type: string
      enum: [UP, DEGRADED, DOWN, UNKNOWN]
    SystemOperationCategory:
      type: string
      enum: [SERVICE, MESSAGE, STORAGE, OTHER]
    SystemOperationsOverview:
      type: object
      required: [status, checkedAt, items]
      properties:
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        checkedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/SystemOperationItem' }
    SystemOperationItem:
      type: object
      required: [key, category, status, latencyMillis, summary]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        latencyMillis: { type: integer, format: int64, minimum: 0 }
        summary: { type: string }
    OperationsObservabilityDataStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    OperationsObservabilityRange:
      type: string
      enum: [1h, 6h, 24h, 7d, 15d]
      default: 24h
    OperationsObservabilityOverview:
      type: object
      required: [dataStatus, range, generatedAt, status, healthy, degraded, down, unknown, items]
      properties:
        dataStatus: { $ref: '#/components/schemas/OperationsObservabilityDataStatus' }
        range: { $ref: '#/components/schemas/OperationsObservabilityRange' }
        generatedAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        healthy: { type: integer, format: int64, minimum: 0 }
        degraded: { type: integer, format: int64, minimum: 0 }
        down: { type: integer, format: int64, minimum: 0 }
        unknown: { type: integer, format: int64, minimum: 0 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OperationsObservabilityItem' }
    OperationsObservabilityItem:
      type: object
      required: [key, category, status, availabilityPercent, averageLatencyMillis, p95LatencyMillis, lastChangedAt, sampleCount]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        availabilityPercent: { type: [number, 'null'], format: double, minimum: 0, maximum: 100 }
        averageLatencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        p95LatencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
        lastChangedAt: { type: [string, 'null'], format: date-time }
        sampleCount: { type: integer, format: int64, minimum: 0 }
    OperationsObservabilitySeries:
      type: object
      required: [key, category, dataStatus, range, generatedAt, points]
      properties:
        key: { type: string }
        category: { $ref: '#/components/schemas/SystemOperationCategory' }
        dataStatus: { $ref: '#/components/schemas/OperationsObservabilityDataStatus' }
        range: { $ref: '#/components/schemas/OperationsObservabilityRange' }
        generatedAt: { type: string, format: date-time }
        points:
          type: array
          items: { $ref: '#/components/schemas/OperationsObservabilityPoint' }
    OperationsObservabilityPoint:
      type: object
      required: [time, status, latencyMillis]
      properties:
        time: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/SystemOperationStatus' }
        latencyMillis: { type: [integer, 'null'], format: int64, minimum: 0 }
    DashboardDataStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE]
    DashboardDeviceState:
      type: string
      enum: [STALE, NEVER_REPORTED]
    OperationsOverview:
      type: object
      required: [generatedAt, dataStatus, freshnessSeconds, devices, telemetry, attentionDevices]
      properties:
        generatedAt: { type: string, format: date-time }
        dataStatus: { $ref: '#/components/schemas/DashboardDataStatus' }
        freshnessSeconds: { type: integer, minimum: 1 }
        devices: { $ref: '#/components/schemas/DashboardDeviceSummary' }
        telemetry: { $ref: '#/components/schemas/DashboardTelemetrySummary' }
        attentionDevices:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/DashboardAttentionDevice' }
    DashboardDeviceSummary:
      type: object
      required: [enabled]
      properties:
        enabled: { type: integer, format: int64, minimum: 0 }
        reporting: { type: [integer, 'null'], format: int64, minimum: 0 }
        stale: { type: [integer, 'null'], format: int64, minimum: 0 }
        neverReported: { type: [integer, 'null'], format: int64, minimum: 0 }
    DashboardTelemetrySummary:
      type: object
      required: [hourly]
      properties:
