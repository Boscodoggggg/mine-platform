        lastError: { type: [string, 'null'], maxLength: 2000 }
    AggregationExecutionStatus:
      type: string
      enum: [RUNNING, SUCCEEDED, PARTIAL, FAILED]
    AggregationExecution:
      type: object
      required:
        - executionId
        - instanceId
        - status
        - policyCount
        - ruleCount
        - sourceWatermark
        - bucketCount
        - lateRowsIgnored
        - startedAt
      properties:
        executionId: { type: string, format: uuid }
        instanceId: { type: string, minLength: 1, maxLength: 128 }
        status: { $ref: '#/components/schemas/AggregationExecutionStatus' }
        policyCount: { type: integer, minimum: 0 }
        ruleCount: { type: integer, minimum: 0 }
        sourceWatermark: { type: integer, format: int64, minimum: 0 }
        bucketCount: { type: integer, minimum: 0 }
        rollupWatermark: { type: [integer, 'null'], format: int64, minimum: 0 }
        lateRowsIgnored: { type: integer, format: int64, minimum: 0 }
        startedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'], maxLength: 2000 }
    StrategyVersion:
      type: object
