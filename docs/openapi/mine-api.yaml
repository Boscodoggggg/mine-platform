            schema: { $ref: '#/components/schemas/ConfigRollbackRequest' }
      responses:
        '201':
          description: 已创建新的回滚发布事实。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
  /command-templates:
    get:
      tags: [CommandCenter]
      operationId: listCommandTemplates
      summary: 查询可下发命令模板
      responses:
        '200':
          description: 已发布的低风险命令模板。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommandTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /command-targets:
    get:
      tags: [CommandCenter]
