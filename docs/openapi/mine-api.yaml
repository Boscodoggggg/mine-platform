openapi: 3.1.0
info:
  title: 智慧矿山平台 API
  version: 0.1.0
  description: |
    智慧矿山平台对管理端开放的 REST 契约。本文件固化阶段 1 已实现的产品、设备台账和遥测查询接口。
    所有时间均为带时区的 ISO-8601 UTC 时间。命令中心只开放已发布的低风险命令模板。
servers:
  - url: /api/v1
security:
  - MineToken: []
tags:
  - name: DeviceRegistry
    description: 产品和设备台账管理
  - name: DeviceTelemetry
    description: 设备最新值与数值遥测历史
  - name: CommandCenter
    description: 设备命令下发与可靠状态时间线
paths:
  /command-templates:
    get:
      tags: [CommandCenter]
      operationId: listCommandTemplates
      summary: 查询可下发命令模板
      responses:
        '200':
          description: 已发布的低风险命令模板。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommandTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /command-targets:
    get:
      tags: [CommandCenter]
      operationId: listCommandTargets
      summary: 分页查询可接收命令的启用设备
      parameters:
        - name: keyword
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200':
          description: 命令目标设备分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandTargetPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /commands:
    get:
      tags: [CommandCenter]
      operationId: listCommands
      summary: 分页查询命令
      parameters:
        - name: deviceId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CommandStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 命令分页。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [CommandCenter]
      operationId: createCommand
      summary: 幂等创建并下发命令
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommandCreateRequest' }
      responses:
        '201':
          description: 命令已创建并进入可靠出站队列。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /commands/{commandId}:
    get:
      tags: [CommandCenter]
      operationId: getCommand
      summary: 查询命令详情与状态时间线
      parameters:
        - $ref: '#/components/parameters/CommandId'
      responses:
        '200':
          description: 命令详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/CommandNotFound' }
  /products:
    get:
      tags: [DeviceRegistry]
      operationId: listProducts
      summary: 分页查询产品
      parameters:
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 产品分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceRegistry]
      operationId: createProduct
      summary: 创建产品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: 产品已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}:
    put:
      tags: [DeviceRegistry]
      operationId: updateProduct
      summary: 修改产品
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: 修改后的产品。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productId}/archive:
    post:
      tags: [DeviceRegistry]
      operationId: archiveProduct
      summary: 归档产品
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '204': { description: 产品已归档。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices:
    get:
      tags: [DeviceRegistry]
      operationId: listDevices
      summary: 分页查询设备
      parameters:
        - name: productId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Keyword'
        - name: status
          in: query
          schema:
            type: string
            enum: [ENABLED, DISABLED, ARCHIVED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 设备分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [DeviceRegistry]
      operationId: createDevice
      summary: 创建设备
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
      responses:
        '201':
          description: 设备已创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ProductNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}:
    put:
      tags: [DeviceRegistry]
      operationId: updateDevice
      summary: 修改设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
      responses:
        '200':
          description: 修改后的设备。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}/archive:
    post:
      tags: [DeviceRegistry]
      operationId: archiveDevice
      summary: 归档设备
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveRequest'
      responses:
        '204': { description: 设备已归档。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/{deviceId}/latest:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceLatestTelemetry
      summary: 查询设备指定属性的最新值
      description: |
        需要 `device:telemetry:view` 权限。优先读取 Redis；缓存缺失时按设备和属性键合并并发请求，
        从 TimescaleDB 回源最近历史并使用 HSETNX 回填，避免旧历史覆盖并发到达的新数据。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyIds
          in: query
          required: true
          description: 传入数量为 1 至 100；服务去重后按首次出现顺序返回。
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              $ref: '#/components/schemas/PropertyId'
      responses:
        '200':
          description: 最新值快照；没有历史的属性出现在 missingPropertyIds。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLatest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
  /devices/{deviceId}/telemetry:
    get:
      tags: [DeviceTelemetry]
      operationId: getDeviceTelemetryHistory
      summary: 分页查询设备单个数值属性历史
      description: |
        需要 `device:telemetry:view` 权限。时间范围采用 `[from, to)`；RAW 最多查询 7 天且不能传 bucket；
        AVG、MIN、MAX 最多查询 366 天，bucket 必须在 1 分钟至 24 小时之间且最多产生 10000 个桶。
        bucket 只接受整秒精度。聚合结果的 quality 取桶内最差质量，sampleCount 表示桶内样本数；
        分页 offset 不得超过 1000000。首页可省略 watermark，响应会返回数据库已提交事件的摄取水位；
        后续页必须原样传回，以排除 RabbitMQ 积压、数据库重试和弱网迟到点在翻页期间造成的重复或遗漏。
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: propertyId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PropertyId'
        - name: from
          in: query
          required: true
          description: 开始时间，包含。
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: 结束时间，不包含。
          schema:
            type: string
            format: date-time
        - name: aggregation
          in: query
          schema:
            type: string
            enum: [RAW, AVG, MIN, MAX]
            default: RAW
        - name: bucket
          in: query
          description: 聚合时间桶，使用 ISO-8601 Duration，例如 PT5M；RAW 查询不能传入。
          schema:
            type: string
            format: duration
        - name: watermark
          in: query
          description: 分页数据集的全局摄取水位上限；首页省略，后续页传回首页响应中的 watermark，不得大于服务端当前已提交水位。
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: 原始遥测点或聚合时间桶分页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/DeviceNotFound'
        '503':
          $ref: '#/components/responses/TelemetryBusy'
components:
  securitySchemes:
    MineToken:
      type: apiKey
      in: header
      name: X-Mine-Token
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: 设备 UUID。
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      description: 命令 UUID。
      schema:
        type: string
        format: uuid
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000000
        default: 1
    PageSize:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    CommandStatus:
      type: string
      enum: [CREATED, QUEUED, SENT, DEVICE_RECEIVED, SUCCEEDED, REFUSED, FAILED, EXPIRED, TIMEOUT, CANCELLED]
    CommandRiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    CommandTemplate:
      type: object
      required: [key, version, riskLevel, defaultTtlSeconds, defaultTimeoutSeconds, parameterSchema]
      properties:
        key: { type: string, maxLength: 128 }
        version: { type: integer, minimum: 1 }
        riskLevel: { $ref: '#/components/schemas/CommandRiskLevel' }
        defaultTtlSeconds: { type: integer, minimum: 1 }
        defaultTimeoutSeconds: { type: integer, minimum: 1 }
        parameterSchema: { type: object, additionalProperties: true }
    Command:
      type: object
      required: [id, deviceId, templateKey, templateVersion, parameters, riskLevel, status, ttlSeconds, timeoutSeconds, idempotencyKey, createdAt, updatedAt, queuedAt, expiresAt, version]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        templateKey: { type: string }
        templateVersion: { type: integer, minimum: 1 }
        parameters: { type: object, additionalProperties: true }
        riskLevel: { $ref: '#/components/schemas/CommandRiskLevel' }
        status: { $ref: '#/components/schemas/CommandStatus' }
        ttlSeconds: { type: integer, minimum: 1 }
        timeoutSeconds: { type: integer, minimum: 1 }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        queuedAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        deviceReceivedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        expiresAt: { type: string, format: date-time }
        lastErrorCode: { type: [string, 'null'] }
        reply: { type: [object, 'null'], additionalProperties: true }
        version: { type: integer, format: int64, minimum: 0 }
    CommandPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Command' }
    CommandTarget:
      type: object
      required: [id, deviceCode, name]
      properties:
        id: { type: string, format: uuid }
        deviceCode: { type: string }
        name: { type: string }
    CommandTargetPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CommandTarget' }
    CommandCreateRequest:
      type: object
      required: [deviceId, templateKey, parameters, ttlSeconds, timeoutSeconds]
      properties:
        deviceId: { type: string, format: uuid }
        templateKey: { type: string, minLength: 1, maxLength: 128 }
        parameters: { type: object, additionalProperties: true }
        ttlSeconds: { type: integer, minimum: 1, maximum: 86400 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 86400 }
    ProductStatus:
      type: string
      enum: [DRAFT, ACTIVE, ARCHIVED]
    DeviceStatus:
      type: string
      enum: [ENABLED, DISABLED, ARCHIVED]
    Product:
      type: object
      required: [id, productKey, name, deviceType, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        productKey: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        name: { type: string, maxLength: 128 }
        deviceType: { type: string, maxLength: 64 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    ProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Product' }
    ProductCreateRequest:
      type: object
      required: [productKey, name, deviceType, status]
      properties:
        productKey: { type: string, pattern: '^[a-z][a-z0-9-]{2,63}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        deviceType: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [DRAFT, ACTIVE] }
    ProductUpdateRequest:
      type: object
      required: [name, deviceType, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        deviceType: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [DRAFT, ACTIVE] }
        version: { type: integer, format: int64, minimum: 0 }
    Device:
      type: object
      required: [id, productId, deviceCode, name, status, createdAt, updatedAt, version]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$' }
        name: { type: string, maxLength: 128 }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        archivedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    DevicePage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Device' }
    DeviceCreateRequest:
      type: object
      required: [productId, deviceCode, name, status]
      properties:
        productId: { type: string, format: uuid }
        deviceCode: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{1,127}$' }
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ENABLED, DISABLED] }
    DeviceUpdateRequest:
      type: object
      required: [name, status, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [ENABLED, DISABLED] }
        version: { type: integer, format: int64, minimum: 0 }
    ArchiveRequest:
      type: object
      required: [version]
      properties:
        version: { type: integer, format: int64, minimum: 0 }
    PageMetadata:
      type: object
      required: [page, size, total]
      properties:
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    PropertyId:
      type: string
      pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,127}$'
    TelemetryQuality:
      type: string
      enum: [GOOD, UNCERTAIN, BAD, TIME_UNTRUSTED]
    DeviceLatest:
      type: object
      required: [deviceId, items, missingPropertyIds]
      properties:
        deviceId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryLatestItem'
        missingPropertyIds:
          type: array
          items:
            $ref: '#/components/schemas/PropertyId'
    TelemetryLatestItem:
      type: object
      required: [propertyId, value, occurredAt, receivedAt, quality, eventId, source]
      properties:
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        value:
          type: number
          format: double
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: string
          format: uuid
        bootId:
          type: [string, 'null']
        sequence:
          type: [integer, 'null']
          format: int64
        source:
          type: string
          enum: [REDIS, TIMESCALEDB]
    TelemetryHistory:
      type: object
      required: [deviceId, propertyId, aggregation, watermark, items, page, size, total]
      properties:
        deviceId:
          type: string
          format: uuid
        propertyId:
          $ref: '#/components/schemas/PropertyId'
        aggregation:
          type: string
          enum: [RAW, AVG, MIN, MAX]
        bucket:
          type: [string, 'null']
          format: duration
        watermark:
          type: integer
          format: int64
          minimum: 0
          description: 本次分页数据集固定使用的数据库摄取水位上限。
        items:
          type: array
          items:
            $ref: '#/components/schemas/TelemetryHistoryPoint'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 1000
        total:
          type: integer
          format: int64
          minimum: 0
    TelemetryHistoryPoint:
      type: object
      required: [occurredAt, receivedAt, value, quality, sampleCount]
      properties:
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        value:
          type: number
          format: double
        quality:
          $ref: '#/components/schemas/TelemetryQuality'
        eventId:
          type: [string, 'null']
          format: uuid
        sampleCount:
          type: integer
          format: int64
          minimum: 1
    ApiError:
      type: object
      required: [code, message, traceId, timestamp, details]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
  responses:
    BadRequest:
      description: 参数、属性标识、时间范围或聚合参数不合法。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: 登录状态无效。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: 缺少当前操作要求的权限。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    DeviceNotFound:
      description: 设备不存在，错误码 DEVICE-404-002。
      content:
        application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    CommandNotFound:
      description: 命令不存在，错误码 COMMAND-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ProductNotFound:
      description: 产品不存在，错误码 DEVICE-404-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 编码重复、状态冲突或乐观锁版本冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 命令模板、目标设备、参数或时间约束不允许下发。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TelemetryBusy:
      description: 等待同一属性的共享回源超过 2 秒或时序库查询超时，错误码 TELEMETRY-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
