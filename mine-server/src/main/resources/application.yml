spring:
  application:
    name: mine-server
  autoconfigure:
    exclude:
      - org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MINE_SERVER_HTTP_PORT:8080}
  shutdown: graceful

mybatis-plus:
  type-handlers-package: com.bosco.mine.server.modules.system.repository

management:
  server:
    port: ${MINE_SERVER_MANAGEMENT_PORT:18080}
    address: ${MINE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db,redis,telemetryQuery

sa-token:
  token-name: X-Mine-Token
  timeout: 43200
  active-timeout: ${MINE_AUTH_ACTIVE_TIMEOUT_SECONDS:1800}
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-body: false

mine:
  platform:
    version: "@project.version@"
  security:
    bootstrap-admin:
      enabled: ${MINE_BOOTSTRAP_ADMIN_ENABLED:false}
      id: ${MINE_BOOTSTRAP_ADMIN_ID:0198aef6-2e80-7000-8000-000000000001}
      username: ${MINE_BOOTSTRAP_ADMIN_USERNAME:mine-admin}
      display-name: ${MINE_BOOTSTRAP_ADMIN_DISPLAY_NAME:矿区超级管理员}
      password-file: ${MINE_BOOTSTRAP_ADMIN_PASSWORD_FILE:/run/secrets/mine_super_admin_password}
    password:
      bcrypt-strength: ${MINE_PASSWORD_BCRYPT_STRENGTH:12}
    login-protection:
      max-failures-per-account: ${MINE_LOGIN_MAX_FAILURES_PER_ACCOUNT:5}
      max-failures-per-source: ${MINE_LOGIN_MAX_FAILURES_PER_SOURCE:25}
      attempt-window: ${MINE_LOGIN_ATTEMPT_WINDOW:PT10M}
      lock-duration: ${MINE_LOGIN_LOCK_DURATION:PT15M}
  rabbitmq:
    admin:
      base-url: ${MINE_RABBITMQ_ADMIN_BASE_URL:http://rabbitmq:15672}
      username-file: ${MINE_RABBITMQ_ADMIN_USERNAME_FILE:/run/secrets/rabbitmq_admin_username}
      password-file: ${MINE_RABBITMQ_ADMIN_PASSWORD_FILE:/run/secrets/rabbitmq_admin_password}
      vhost: ${MINE_RABBITMQ_DEVICE_VHOST:/mine-device}
      connect-timeout: ${MINE_RABBITMQ_ADMIN_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${MINE_RABBITMQ_ADMIN_REQUEST_TIMEOUT:PT10S}
  telemetry-query:
    enabled: ${MINE_TELEMETRY_QUERY_ENABLED:false}
    url: ${MINE_TELEMETRY_QUERY_URL:jdbc:postgresql://timescale:5432/mine_telemetry}
    username: ${MINE_TELEMETRY_QUERY_USERNAME:mine_ts_reader}
    password-file: ${MINE_TELEMETRY_QUERY_PASSWORD_FILE:/run/secrets/timescale_reader_password}
    maximum-pool-size: ${MINE_TELEMETRY_QUERY_MAXIMUM_POOL_SIZE:5}
    connection-timeout: ${MINE_TELEMETRY_QUERY_CONNECTION_TIMEOUT:PT2S}
    query-timeout: ${MINE_TELEMETRY_QUERY_QUERY_TIMEOUT:PT2S}
  realtime:
    enabled: ${MINE_REALTIME_ENABLED:false}
    path: ${MINE_REALTIME_PATH:/api/v1/realtime}
    instance-id: ${MINE_REALTIME_INSTANCE_ID:${HOSTNAME:standalone}}
    max-subscriptions: ${MINE_REALTIME_MAX_SUBSCRIPTIONS:64}
    max-devices: ${MINE_REALTIME_MAX_DEVICES:128}
    max-properties: ${MINE_REALTIME_MAX_PROPERTIES:1024}
    max-message-bytes: ${MINE_REALTIME_MAX_MESSAGE_BYTES:65536}
    rabbit-enabled: ${MINE_REALTIME_RABBIT_ENABLED:false}
    rabbit-host: ${MINE_REALTIME_RABBIT_HOST:rabbitmq}
    rabbit-port: ${MINE_REALTIME_RABBIT_PORT:5672}
    rabbit-auto-startup: ${MINE_REALTIME_RABBIT_AUTO_STARTUP:true}
    rabbit-prefetch: ${MINE_REALTIME_RABBIT_PREFETCH:500}
    account:
      username: ${MINE_REALTIME_RABBIT_USERNAME:mine-server-realtime}
      password-file: ${MINE_REALTIME_RABBIT_PASSWORD_FILE:/run/secrets/rabbitmq_server_realtime_password}
