        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ProtocolConfiguration]
      operationId: publishConfigRelease
      summary: 通过黄金样本门禁后发布不可变配置包
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigPublishRequest' }
      responses:
        '201':
          description: 已创建配置发布事实，Location 指向发布详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /config-releases/{releaseId}:
    get:
      tags: [ProtocolConfiguration]
      operationId: getConfigRelease
      summary: 查询配置发布和运行节点加载状态
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          description: 不含完整运行快照的配置发布详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigReleaseDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ConfigurationNotFound' }
  /config-releases/{releaseId}/rollback:
    post:
      tags: [ProtocolConfiguration]
      operationId: rollbackConfigRelease
      summary: 复用历史配置包创建更高序号的回滚发布
      parameters:
        - $ref: '#/components/parameters/ReleaseId'
