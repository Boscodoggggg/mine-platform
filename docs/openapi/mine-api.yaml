          in: query
          schema: { type: string, enum: [QUARANTINED, AVAILABLE, ARCHIVED] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: 三维资源分页。, content: { application/json: { schema: { $ref: '#/components/schemas/SceneAssetPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [MineScene]
      operationId: uploadMineSceneAsset
      summary: 上传并同步安全校验三维资源
      description: |
        需要 mine:scene:asset:upload 权限。仅接受 GLB 或 3D Tiles ZIP；服务端 multipart
        单文件上限为 2GB，校验通过并完整登记文件清单后资源才进入 AVAILABLE。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: 三维资源已安全登记，重复摘要返回既有资源。, content: { application/json: { schema: { $ref: '#/components/schemas/SceneAssetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: multipart 请求超过服务端固定上限。 }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/SceneStorageUnavailable' }
  /mine/sites/{siteId}/scene-assets/{assetId}:
    get:
      tags: [MineScene]
      operationId: getMineSceneAsset
