          schema: { type: string, maxLength: 128 }
        - name: ruleKey
          in: query
          schema: { type: string, maxLength: 64 }
        - name: from
          in: query
          description: 触发时间范围起点，包含。
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: 触发时间范围终点，不包含。
          schema: { type: string, format: date-time }
