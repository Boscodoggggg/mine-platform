    get:
      tags: [AlarmCenter]
      operationId: getAlarm
      summary: 查询告警周期完整事实
      parameters:
        - $ref: '#/components/parameters/AlarmId'
      responses:
        '200':
          description: 告警详情。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alarm' }
