        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/MineResourceNotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '503': { $ref: '#/components/responses/OperationQueryUnavailable' }

  /mine/sites/{siteId}/scene-assets:
    get:
      tags: [MineScene]
      operationId: listMineSceneAssets
      summary: 分页查询矿区三维资源
      description: 需要 mine:scene:view 权限，组织和矿区范围在读取资源前校验。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
