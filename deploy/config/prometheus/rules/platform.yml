groups:
  - name: mine-platform-availability
    rules:
      - alert: MineRuntimeServiceDown
        expr: up{job=~"mine-server|mine-gateway|mine-telemetry"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "智慧矿山运行服务不可用"
          description: "{{ $labels.job }} 已连续 2 分钟无法被 Prometheus 抓取。"

      - alert: MineRabbitMqDown
        expr: up{job="rabbitmq"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ 不可用"
          description: "设备 MQTT 与内部消息总线监控目标不可用。"

      - alert: MineDatabaseExporterDown
        expr: up{job=~"postgres|timescale"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "数据库指标采集失败"
          description: "{{ $labels.job }} exporter 已连续 3 分钟不可用。"

      - alert: MineRedisDown
        expr: up{job="redis"} == 0 or redis_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis 不可用"
          description: "Redis exporter 无法被采集或无法连接平台 Redis。"

  - name: mine-platform-capacity
    rules:
      - alert: MineJvmHeapPressureHigh
        expr: sum by (job) (jvm_memory_used_bytes{area="heap"}) / sum by (job) (jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存持续偏高"
          description: "{{ $labels.job }} 堆内存使用率已连续 10 分钟超过 85%。"

      - alert: MineRabbitQueueBacklogHigh
        expr: sum(rabbitmq_queue_messages_ready) > 100000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ 消息积压"
          description: "待消费消息已连续 5 分钟超过 100000 条。"

  - name: mine-gateway-configuration
    rules:
      - alert: MineGatewayConfigurationLoadFailed
        expr: increase(mine_gateway_configuration_distribution_total{outcome="permanent_failure"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway 配置发布永久加载失败"
          description: "最近 10 分钟有配置快照被判定为永久无效，节点已上报 FAILED；请在策略工作台核对发布证据。"

      - alert: MineGatewayConfigurationRetrying
        expr: increase(mine_gateway_configuration_distribution_total{outcome="transient_failure"}[10m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway 配置分发持续重试"
          description: "Gateway 在 10 分钟内至少 3 次因网络、磁盘或状态回报失败而重投配置事件。"

  - name: mine-gateway-tcp
    rules:
      - alert: MineGatewayTcpListenerDown
        expr: max by (job, protocol) (mine_gateway_tcp_listener_up) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway TCP 二进制监听器不可用"
          description: "{{ $labels.job }} 的 {{ $labels.protocol }} 监听器已连续 2 分钟停止接受连接。"

      - alert: MineGatewayTcpConnectionsRejected
        expr: sum by (job, protocol) (increase(mine_gateway_tcp_connections{result="rejected"}[10m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway TCP 连接持续被拒绝"
          description: "{{ $labels.protocol }} 最近 10 分钟至少拒绝 10 个连接，请检查全局及单来源连接上限和异常接入流量。"

      - alert: MineGatewayTcpFramesRejected
        expr: sum by (job, protocol, reason) (increase(mine_gateway_tcp_frames{result="rejected"}[10m])) >= 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway TCP 二进制帧持续被拒绝"
          description: "{{ $labels.protocol }} 因固定原因 {{ $labels.reason }} 在最近 10 分钟至少拒绝 10 帧，请检查设备协议版本、CRC、身份和链路质量。"

      - alert: MineGatewayTcpPublishFailures
        expr: sum by (job, protocol) (increase(mine_gateway_tcp_publish_failures{result="failure"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Gateway TCP 遥测可靠发布失败"
          description: "{{ $labels.protocol }} 最近 5 分钟出现 RabbitMQ 发布确认或 ACK 编码失败；Gateway 未向设备返回成功确认。"

      - alert: MineGatewayTcpNoSuccessfulTelemetry
        expr: >-
          (max by (job, instance, protocol) (mine_gateway_tcp_listener_up) == 1)
          and on (job, instance) (time() - process_start_time_seconds >= 1800)
          and on (job, instance, protocol) (sum by (job, instance, protocol)
          (increase(mine_gateway_tcp_frames{result="success"}[30m])) == 0)
        labels:
          severity: warning
        annotations:
          summary: "Gateway TCP 长时间没有成功遥测"
          description: "{{ $labels.protocol }} 监听器仍在线，进程已运行且连续 30 分钟没有完成解析、可靠发布和 ACK，请检查矿区设备、边缘网络及协议配置。"

  - name: mine-telemetry-strategy-quality
    rules:
      - alert: MineTelemetryStrategyLoadFailed
        expr: increase(mine_telemetry_strategy_distribution_total{outcome="permanent_failure"}[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Telemetry 数据质量策略永久加载失败"
          description: "最近 10 分钟有策略快照未通过完整性校验并进入死信；最后正确版本仍在运行，请检查策略队列死信和控制面快照。"

      - alert: MineTelemetryStrategyRetrying
        expr: increase(mine_telemetry_strategy_distribution_total{outcome="transient_failure"}[10m]) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Telemetry 策略分发持续重试"
          description: "Telemetry 在 10 分钟内至少 3 次因控制面、网络或数据库暂时失败而重投策略事件。"

      - alert: MineTelemetryDataQualitySpike
        expr: sum by (rule, result) (increase(mine_telemetry_quality_rule_hits_total[10m])) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "遥测数据质量异常突增"
          description: "规则 {{ $labels.rule }} 的 {{ $labels.result }} 结果在最近 10 分钟命中至少 100 次；请核对设备时钟、传感器和当前数据质量策略。"

  - name: mine-alarm-runtime
    rules:
      - alert: MineTelemetryAlarmOutboxBacklog
        expr: sum(mine_telemetry_alarm_outbox_events{status=~"PENDING|PUBLISHING"}) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "告警可靠发布持续积压"
          description: "Telemetry 待发布或发布中的告警 Outbox 事件已连续 5 分钟超过 1000 条，请检查 RabbitMQ 和发布确认。"

      - alert: MineTelemetryAlarmOutboxFailed
        expr: mine_telemetry_alarm_outbox_events{status="FAILED"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "告警可靠发布持续重试"
          description: "Telemetry 存在持续 5 分钟尚未重试成功的告警 Outbox 事件，请检查 RabbitMQ 路由、网络和发布确认。"

      - alert: MineTelemetryAlarmOutboxDead
        expr: mine_telemetry_alarm_outbox_events{status="DEAD"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "告警可靠发布事件进入死信"
          description: "Telemetry 存在已耗尽重试次数的告警 Outbox 事件，告警事实尚未送达告警中心，必须立即人工处置。"

      - alert: MineServerAlarmConsumeFailures
        expr: sum(increase(mine_server_alarm_consume_total{outcome="rejected"}[10m])) > 0 or sum(increase(mine_server_alarm_consume_total{outcome="requeued"}[10m])) >= 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "告警事实消费异常"
          description: "最近 10 分钟出现永久拒绝的告警事件，或至少 5 次暂时失败重投；请检查死信、数据库和消息契约。"

      - alert: MineCriticalActiveAlarmsGrowing
        expr: mine_server_alarm_active{severity="CRITICAL"} >= 10 and delta(mine_server_alarm_active{severity="CRITICAL"}[10m]) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "严重活动告警持续增长"
          description: "严重活动告警不少于 10 条且 10 分钟内净增长至少 5 条，请立即进入告警中心组织处置。"

  - name: mine-telemetry-retention
    rules:
      - alert: MineTelemetryRetentionConsecutiveFailures
        expr: max by (job) (mine_telemetry_retention_consecutive_failures) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "数据保留任务连续失败"
          description: "{{ $labels.job }} 数据保留任务已连续失败至少 3 轮，请检查 TimescaleDB、执行事实和最近脱敏错误。"

      - alert: MineTelemetryRetentionNoRecentSuccess
        expr: >-
          ((max by (job) (mine_telemetry_retention_last_success_epoch_seconds) > 0)
          and on (job) (time() - max by (job)
          (mine_telemetry_retention_last_success_epoch_seconds) > 7200))
          or ((max by (job) (mine_telemetry_retention_last_success_epoch_seconds) == 0)
          and on (job) (time() - min by (job)
          (mine_telemetry_retention_started_epoch_seconds) > 7200))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "数据保留任务长时间没有完整成功"
          description: "{{ $labels.job }} 超过 2 小时没有完成一次全量过期扫描，请检查失败、锁竞争或持续部分完成状态。"

      - alert: MineTelemetryRetentionPersistentlyPartial
        expr: max by (job) (mine_telemetry_retention_consecutive_partial) >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "数据保留任务持续未完成"
          description: "{{ $labels.job }} 已连续至少 3 轮达到有界批次上限，请评估积压、批次参数和 TimescaleDB 执行计划。"

      - alert: MineTelemetryRetentionAggregationCoverageBlocked
        expr: max by (job) (mine_telemetry_retention_aggregation_coverage_blocked_rows) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "聚合覆盖持续阻塞原始数据清理"
          description: "{{ $labels.job }} 连续 15 分钟发现已过保留期但尚未满足当前聚合策略覆盖门禁的原始遥测，请检查聚合失败、积压、策略版本和修正窗口。"

  - name: mine-telemetry-aggregation
    rules:
      - alert: MineTelemetryAggregationConsecutiveFailures
        expr: max by (job) (mine_telemetry_aggregation_consecutive_failures) >= 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "数值聚合任务连续失败"
          description: "{{ $labels.job }} 数值聚合任务已连续失败至少 3 轮，请检查 TimescaleDB、执行事实和最近脱敏错误。"

      - alert: MineTelemetryAggregationNoRecentSuccess
        expr: >-
          ((max by (job) (mine_telemetry_aggregation_last_success_epoch_seconds) > 0)
          and on (job) (time() - max by (job)
          (mine_telemetry_aggregation_last_success_epoch_seconds) > 1800))
          or ((max by (job) (mine_telemetry_aggregation_last_success_epoch_seconds) == 0)
          and on (job) (time() - min by (job)
          (mine_telemetry_aggregation_started_epoch_seconds) > 1800))
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数值聚合任务长时间没有完整成功"
          description: "{{ $labels.job }} 超过 30 分钟没有完成一次固定水位闭合桶扫描，请检查失败、锁竞争或持续部分完成状态。"

      - alert: MineTelemetryAggregationPersistentlyPartial
        expr: max by (job) (mine_telemetry_aggregation_consecutive_partial) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "数值聚合任务持续未完成"
          description: "{{ $labels.job }} 已连续至少 3 轮达到有界聚合上限，请评估桶积压、批次参数和 TimescaleDB 查询计划。"

      - alert: MineTelemetryAggregationLateRowsIgnored
        expr: sum by (job) (increase(mine_telemetry_aggregation_late_rows_ignored_total[15m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "遥测到达延迟超过聚合修正窗口"
          description: "{{ $labels.job }} 最近 15 分钟存在未纳入聚合的超窗口迟到遥测，请检查边缘网络、设备时钟和修正窗口策略。"

      - alert: MineTelemetryAggregationRecomputeConsecutiveFailures
        expr: >-
          (max by (job) (mine_telemetry_aggregation_recompute_enabled) == 1)
          and on (job) (max by (job)
          (mine_telemetry_aggregation_recompute_consecutive_failures) >= 3)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "显式聚合重算连续失败"
          description: "{{ $labels.job }} 显式重算已连续失败至少 3 轮，请检查控制面内部接口、service token、TimescaleDB 和最近脱敏错误。"

      - alert: MineTelemetryAggregationRecomputeWorkerStuck
        expr: >-
          (max by (job) (mine_telemetry_aggregation_recompute_enabled) == 1)
          and on (job) (max by (job)
          (mine_telemetry_aggregation_recompute_running) == 1)
          and on (job) (time() - max by (job)
          (mine_telemetry_aggregation_recompute_operation_started_epoch_seconds) > 900)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "显式聚合重算执行卡死"
          description: "{{ $labels.job }} 单次显式重算已运行超过 15 分钟，超过默认租约恢复窗口，请检查数据库锁、慢查询和线程转储。"

      - alert: MineTelemetryAggregationRecomputeNoRecentPoll
        expr: >-
          (max by (job) (mine_telemetry_aggregation_recompute_enabled) == 1)
          and on (job) (((max by (job)
          (mine_telemetry_aggregation_recompute_last_poll_epoch_seconds) > 0)
          and on (job) (time() - max by (job)
          (mine_telemetry_aggregation_recompute_last_poll_epoch_seconds) > 300))
          or ((max by (job)
          (mine_telemetry_aggregation_recompute_last_poll_epoch_seconds) == 0)
          and on (job) (time() - min by (job)
          (mine_telemetry_aggregation_started_epoch_seconds) > 300)))
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "显式聚合重算长时间没有轮询控制面"
          description: "{{ $labels.job }} 超过 5 分钟未成功访问重算认领接口，请检查调度线程、mine-server 健康状态和内部网络。"

      - alert: MineServerAggregationRecomputeClaimableBacklog
        expr: >-
          max by (job)
          (mine_server_aggregation_recompute_claimable_oldest_age_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "显式聚合重算可认领请求持续积压"
          description: "{{ $labels.job }} 最老可认领重算请求已等待超过 10 分钟，请检查 Telemetry 重算消费、租约和控制面鉴权。"

      - alert: MineTelemetryAggregationRecomputeLeaseLost
        expr: >-
          sum by (job) (increase(mine_telemetry_aggregation_recompute_runs_total
          {status="LEASE_LOST"}[15m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "显式聚合重算发生租约转移"
          description: "{{ $labels.job }} 最近 15 分钟发生重算完成回写租约丢失，系统会用稳定执行标识自动重放；若持续出现请检查查询时长和租约配置。"
