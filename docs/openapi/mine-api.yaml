      type: object
      required: [eligibleRows, atLeast]
      properties:
        eligibleRows:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: 达到删除年龄的候选行数，可能是统计上限。
        earliestEligibleAt:
          type: [string, 'null']
          format: date-time
        atLeast:
          type: boolean
          description: true 表示实际候选数量大于 eligibleRows。
    RetentionPreview:
      type: object
      required:
        - previewToken
        - observedAt
        - expiresAt
        - targetDeviceCount
        - affectedDeviceCount
        - enabledDeviceCount
        - policy
        - rawTelemetry
        - qualityEvidence
      properties:
        previewToken:
          type: string
          format: uuid
          description: 仅能由同一管理员用于一次精确匹配的发布或回滚。
        observedAt:
          type: string
          format: date-time
          description: TimescaleDB 统计时点；纯停删预览为服务端生成时点。
        expiresAt: { type: string, format: date-time }
        targetDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 作用域内参与最终策略解析的设备数。
        affectedDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 发布后最终保留策略值发生变化的设备数。
        enabledDeviceCount:
          type: integer
          format: int64
          minimum: 0
          description: 发布后最终策略仍启用删除的设备数，包含更具体作用域覆盖。
        policy: { $ref: '#/components/schemas/RetentionPolicy' }
        rawTelemetry: { $ref: '#/components/schemas/RetentionDatasetImpact' }
        qualityEvidence: { $ref: '#/components/schemas/RetentionDatasetImpact' }
