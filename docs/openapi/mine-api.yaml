      responses:
        '204': { description: 设备已归档。 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/DeviceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /devices/access-status:
    get:
      tags: [DeviceRegistry]
      operationId: listDeviceAccessStatuses
      summary: 批量查询设备持续接入状态
      parameters:
        - name: deviceIds
          in: query
          required: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items: { type: string, format: uuid }
      responses:
        '200':
          description: 与请求设备对应的持续接入状态。
          content:
            application/json:
