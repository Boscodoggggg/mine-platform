listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

default_user = $(SEED_USERNAME)
default_pass = $(SEED_USER_PASSWORD)
default_vhost = /mine-platform

mqtt.listeners.tcp = none
mqtt.listeners.ssl.default = 8883
mqtt.allow_anonymous = false
mqtt.vhost = /mine-device
mqtt.exchange = amq.topic
mqtt.durable_queue_type = classic
mqtt.prefetch = 50

ssl_options.certfile = /run/secrets/tls_certificate
ssl_options.keyfile = /run/secrets/tls_private_key
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

heartbeat = 60
consumer_timeout = 3600000
channel_max = 2048
vm_memory_high_watermark.absolute = 1200MiB
disk_free_limit.absolute = 2GB
log.console = true
log.console.level = info
