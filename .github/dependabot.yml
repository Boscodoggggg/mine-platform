version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    groups:
      java-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /mine-web
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
    groups:
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: Asia/Shanghai
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"
