        - propertyId
        - bucket
        - from
        - to
        - reason
        - idempotencyKey
        - status
        - requestedBy
        - createdAt
      properties:
        requestId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        propertyId: { $ref: '#/components/schemas/PropertyId' }
