      description: 设备组、策略版本、策略发布或目标设备不存在，错误码前缀为 STRATEGY-404。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: 编码重复、状态冲突、策略同级异值、幂等语义或乐观锁版本冲突；场景幂等键冲突码为 MINE-SCENE-409-005。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnprocessableEntity:
      description: 命令、目标设备、策略类型、字段值或作用范围不符合业务约束。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
