spring:
  application:
    name: mine-telemetry
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${MINE_TELEMETRY_HTTP_PORT:8082}
  shutdown: graceful

management:
  server:
    port: ${MINE_TELEMETRY_MANAGEMENT_PORT:18082}
    address: ${MINE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: 矿山遥测处理服务
    version: ${MINE_APP_VERSION:0.1.0-SNAPSHOT}
