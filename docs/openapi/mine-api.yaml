      description: 位置查询存储不可用，错误码 MINE-LOCATION-503-001。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    SpatialRuntimeUnavailable:
      description: 空间事件只读查询或最小权限重放登记连接不可用，错误码前缀为 MINE-SPATIAL-*-503。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
