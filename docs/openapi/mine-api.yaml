      responses:
        '200': { description: 归档后的资源。, content: { application/json: { schema: { $ref: '#/components/schemas/SceneAssetResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SceneResourceNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /mine/sites/{siteId}/scene-assets/{assetId}/files/{relativePath}:
    get:
      tags: [MineScene]
      operationId: downloadMineSceneAssetFile
      summary: 受权读取一个已登记的三维资源文件
      description: |
        需要 mine:scene:view 权限。服务端先校验组织/矿区范围，再从数据库文件清单解析内容寻址对象；
        不接受宿主机路径或任意外链。支持 ETag 条件请求和一个 bytes Range，多范围及越界范围返回 416。
      parameters:
        - { $ref: '#/components/parameters/SiteId' }
        - { $ref: '#/components/parameters/SceneAssetId' }
        - name: relativePath
          in: path
          required: true
          allowReserved: true
          description: 已登记的完整包内相对路径，可包含斜杠。
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: Range
          in: header
          required: false
          description: 单一 bytes 字节范围，例如 bytes=0-1023。
          schema: { type: string, pattern: '^bytes=[0-9]*-[0-9]*$' }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 完整文件流。
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 0 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '206':
          description: 单一字节范围文件流。
          headers:
            ETag: { schema: { type: string } }
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64, minimum: 1 } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '304': { description: ETag 未变化，无响应体。 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/SceneResourceNotFound' }
        '416':
          description: 多范围、非法范围或越界范围，Content-Range 返回完整资源长度。
          headers:
            Content-Range: { schema: { type: string } }
        '503': { $ref: '#/components/responses/SceneStorageUnavailable' }
